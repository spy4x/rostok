---
# Playbook: Setup Backup Cronjob
# This playbook configures the automated backup system to run daily via cron.
# The script (`scripts/backup/+main.ts`) and the root env file
# (`.env.root`) live in the **repo checkout** (`repo_path`). The
# per-server env (`env_file_path`) and the deployed app data
# (`apps_path`) live elsewhere — the cron needs both: `repo_path` for
# the code, `env_file_path` for the server's secrets and `BACKUP_PATHS`.

- name: Setup Backup Cronjob
  hosts: homelab_servers
  become: true # Root is needed to write another user's crontab and /etc/sudoers.d

  vars:
    # Backup scheduling configuration
    # Default: 19:00 UTC (3:00 AM next day UTC+8 Singapore time)
    backup_cron_hour: "{{ lookup('env', 'BACKUP_CRON_HOUR') | default('19', true) }}"
    backup_cron_minute: "{{ lookup('env', 'BACKUP_CRON_MINUTE') | default('0', true) }}"

  tasks:
    - name: Ensure backup script exists in the repo checkout
      ansible.builtin.stat:
        path: "{{ repo_path }}/scripts/backup/+main.ts"
      register: backup_script

    - name: Fail if backup script doesn't exist
      ansible.builtin.fail:
        msg: "Backup script not found at {{ repo_path }}/scripts/backup/+main.ts (set REPO_PATH in servers/<server>/.env to the repo checkout)"
      when: not backup_script.stat.exists

    - name: Ensure repo root env file exists
      ansible.builtin.stat:
        path: "{{ repo_path }}/.env.root"
      register: root_env_file

    - name: Fail if repo root env file doesn't exist
      ansible.builtin.fail:
        msg: ".env.root not found at {{ repo_path }}/.env.root (the cron needs it for shared secrets)"
      when: not root_env_file.stat.exists

    - name: Ensure server env file exists
      ansible.builtin.stat:
        path: "{{ env_file_path }}"
      register: env_file

    - name: Fail if server env file doesn't exist
      ansible.builtin.fail:
        msg: ".env file not found at {{ env_file_path }}"
      when: not env_file.stat.exists

    - name: Ensure Deno is installed
      ansible.builtin.stat:
        path: "{{ deno_install_path }}/bin/deno"
      register: deno_binary

    - name: Fail if Deno is not installed
      ansible.builtin.fail:
        msg: "Deno not found at {{ deno_install_path }}/bin/deno. Run initial-setup.yml first."
      when: not deno_binary.stat.exists

    - name: Setup sudoers for backup ownership changes
      ansible.builtin.copy:
        dest: /etc/sudoers.d/backup-chown
        mode: "0440"
        content: |
          # Allow homelab user to change ownership for backup operations
          # This is needed because backup runs as root but needs to fix ownership
          # for volumes and backup repositories for user access
          {{ ssh_user }} ALL=(ALL) NOPASSWD: /usr/bin/chown -R {{ ssh_user }}\:{{ ssh_user }} {{ volumes_path }}/*
          {{ ssh_user }} ALL=(ALL) NOPASSWD: /usr/bin/chown -R {{ ssh_user }}\:{{ ssh_user }} {{ backup_log_path }}
          {{ ssh_user }} ALL=(ALL) NOPASSWD: /usr/bin/chown -R {{ ssh_user }}\:{{ ssh_user }} {{ backups_path }}/*
        validate: "visudo -cf %s"

    - name: Create backup log file if it doesn't exist
      ansible.builtin.file:
        path: "{{ backup_log_path }}"
        state: touch
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"
        mode: "0644"
        modification_time: preserve
        access_time: preserve

    - name: Setup backup cronjob
      ansible.builtin.cron:
        name: "Homelab Backup"
        user: "{{ backup_cron_user }}"
        minute: "{{ backup_cron_minute }}"
        hour: "{{ backup_cron_hour }}"
        # SSH_USER= belt-and-suspenders alongside the server .env
        # (--env-file={{ env_file_path }}), which also carries SSH_USER —
        # cron's own environment is otherwise minimal and this keeps the
        # job correct even if the file load order ever changes.
        job: "SSH_USER={{ ssh_user }} {{ deno_install_path }}/bin/deno run --env-file={{ repo_path }}/.env.root --env-file={{ env_file_path }} -A {{ repo_path }}/scripts/backup/+main.ts >> {{ backup_log_path }} 2>&1"
        state: present

    - name: Display cronjob info
      ansible.builtin.debug:
        msg:
          - "Backup cronjob configured successfully!"
          - "Schedule: Daily at {{ backup_cron_hour }}:{{ '%02d' | format(backup_cron_minute | int) }}"
          - "Log file: {{ backup_log_path }}"
          - "To view logs: tail -f {{ backup_log_path }}"
          - "To test manually: sudo -u {{ backup_cron_user }} SSH_USER={{ ssh_user }} {{ deno_install_path }}/bin/deno run --env-file={{ repo_path }}/.env.root --env-file={{ env_file_path }} -A {{ repo_path }}/scripts/backup/+main.ts"
