# Checks run on every pull request into main and every push to main. A `v*` tag
# runs the same checks, publishes to JSR (see "Publish flow" in AGENTS.md), and
# then attaches the rostok binaries to a GitHub Release (steps `binaries` and
# `release`, #528).
# `branch` matches a pull request by its target branch, so a commit on a PR
# branch builds once, as a pull_request, not again as a push.
when:
  - event: [push, pull_request]
    branch: main
  - event: tag
    ref: refs/tags/v*

steps:
  # Lints every Dockerfile in the checkout, so a new stack's Dockerfile is picked up without
  # editing this step (#65). Ignored rules and their reasons are in .hadolint.yaml. It needs
  # Docker nowhere and holds no secret; with no Dockerfile found, hadolint gets no file and fails.
  hadolint:
    image: hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552
    commands:
      - find . -path ./.git -prune -o -type f -iname '*dockerfile*' -print | sort | xargs hadolint

  check:
    # Pinned by digest, like `publish`: both steps share the working folder,
    # and the publish image has no git, so `deno publish` cannot refuse files
    # that `check` changed. Bump both digests together.
    image: denoland/deno:2.9.0@sha256:8d24854de78a79c56e74b49aa4c5996c60e1fe3730efba8fbdd2692c582e6e29
    commands:
      # Install git for the .gitignore checks (cli/init.test.ts runs
      # `git check-ignore`) and worktree/hook fixtures elsewhere. `age`
      # is no longer needed: encryption runs in-process
      # (@spy4x/server/env-age64), no binary on PATH required. `zsh` is
      # needed because stale-stacks.test.ts (#243) runs the generated
      # cleanup script under zsh as well as sh — the remote deploy
      # user's login shell is often zsh, not sh, and a script that only
      # works under sh must fail loudly here, not be silently skipped.
      # `curl` runs install.sh in install.test.ts.
      - apt-get update && apt-get install -y git zsh curl
      - deno task check

  # Guards against an accidental release: a `v*` tag publishes to JSR with the token, so this
  # step fails the build unless the tagged commit is already on `main` (reviewed, green CI).
  # It is not access control, and the `publish` comment below still holds: a tag build runs
  # the tagged commit's own copy of this file, so a tag on a branch that predates this step
  # or one that removes it still publishes. A tag build's clone is full but has no `main`
  # ref, which is why the step fetches it.
  on-main:
    image: alpine/git:2.47.2
    when:
      event: tag
      ref: refs/tags/v*
    commands:
      - git fetch --no-tags --depth=2147483647 origin main
      - git merge-base --is-ancestor "$${CI_COMMIT_SHA}" FETCH_HEAD || { echo "Refusing to publish, commit $${CI_COMMIT_SHA} is not on main"; exit 1; }

  # Publishes @rostok/cli to JSR, only on a `v*` tag and only after `check`
  # passed. JSR_TOKEN is a repository secret that must be allowed for the tag
  # event only (never push or pull_request), so push and pull-request builds
  # cannot read it. A tag build runs the tagged commit's own copy of this
  # file, so whoever can push a `v*` tag can publish and can read the token
  # (see "The publish token" in AGENTS.md). `$$` stops Woodpecker substituting the
  # variable itself; the shell reads the secret.
  publish:
    # Pinned by digest: this step holds the token, so a re-pushed image tag
    # must not change what runs.
    image: denoland/deno:2.9.0@sha256:8d24854de78a79c56e74b49aa4c5996c60e1fe3730efba8fbdd2692c582e6e29
    when:
      event: tag
      ref: refs/tags/v*
    environment:
      JSR_TOKEN:
        from_secret: JSR_TOKEN
    commands:
      # `deno publish` exits 0 when the version is already on JSR, so a tag
      # pushed without the version bump would go green and publish nothing;
      # this refuses any tag that is not `v` plus the declared version.
      - deno run --allow-read=deno.jsonc,cli/version.ts --allow-env=CI_COMMIT_TAG scripts/release/+main.ts
      # A stalled upload is retried (#483): each attempt gets 10 minutes, and a version already
      # on JSR is skipped, so a retry publishes only what is missing. Each attempt logs its start,
      # end and exit code, so a stall shows whether the time went to the upload or to JSR.
      - |
        for attempt in 1 2 3; do
          echo "publish attempt $${attempt} started $$(date -u +%H:%M:%S)"
          rc=0
          timeout 600 deno publish --token "$${JSR_TOKEN}" || rc=$$?
          echo "publish attempt $${attempt} ended $$(date -u +%H:%M:%S), exit code $${rc}"
          if [ "$${rc}" -eq 0 ]; then exit 0; fi
        done
        exit 1

  # Builds one gzip-compressed binary per platform plus SHA256SUMS into dist/
  # (scripts/release/compile.ts). It runs after `publish`, so JSR is published
  # whatever happens here, and it holds no secret: the build runs repository code.
  binaries:
    image: denoland/deno:2.9.0@sha256:8d24854de78a79c56e74b49aa4c5996c60e1fe3730efba8fbdd2692c582e6e29
    when:
      event: tag
      ref: refs/tags/v*
    commands:
      - deno task compile --out dist

  # Creates the GitHub Release for the tag with the files from `binaries`. It
  # runs no repository code: only curl and the shell lines below, in a pinned
  # image. GITHUB_RELEASE_TOKEN is a repository secret allowed for the tag event
  # only, a fine-grained token with "Contents: write" on this repository. The
  # release is created as a draft, gets every file, and only then is published,
  # so `releases/latest` (what `rostok upgrade`, the update notice and
  # install.sh read) never points at a release without binaries. A release that
  # already exists for the tag is left alone, so a restarted pipeline is safe; a
  # draft left by a failed upload stays invisible and can be deleted on GitHub.
  release:
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    when:
      event: tag
      ref: refs/tags/v*
    environment:
      GITHUB_RELEASE_TOKEN:
        from_secret: GITHUB_RELEASE_TOKEN
    commands:
      - |
        set -eu
        tag="$${CI_COMMIT_TAG}"
        echo "$${tag}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$$' || { echo "Refusing tag $${tag}"; exit 1; }
        [ -s dist/SHA256SUMS ] || { echo "dist/SHA256SUMS is missing: step binaries failed"; exit 1; }
        api="https://api.github.com/repos/$${CI_REPO}"
        api_call() { curl -fsS -H "Authorization: Bearer $${GITHUB_RELEASE_TOKEN}" -H "Accept: application/vnd.github+json" "$$@"; }
        if api_call -o /dev/null "$${api}/releases/tags/$${tag}" 2>/dev/null; then
          echo "Release $${tag} exists already, nothing to do"
          exit 0
        fi
        created="$$(api_call -X POST "$${api}/releases" -d "{\"tag_name\":\"$${tag}\",\"name\":\"$${tag}\",\"draft\":true,\"generate_release_notes\":true}")"
        id="$$(printf '%s' "$${created}" | sed -n 's|.*"upload_url": *"[^"]*/releases/\([0-9][0-9]*\)/assets.*|\1|p')"
        [ -n "$${id}" ] || { echo "Could not read the new release id"; exit 1; }
        for f in dist/*; do
          name="$$(basename "$${f}")"
          echo "Uploading $${name}"
          api_call -o /dev/null -X POST -H "Content-Type: application/octet-stream" --data-binary "@$${f}" \
            "https://uploads.github.com/repos/$${CI_REPO}/releases/$${id}/assets?name=$${name}"
        done
        api_call -o /dev/null -X PATCH "$${api}/releases/$${id}" -d '{"draft":false,"make_latest":"true"}'
        echo "Released $${tag}"
