when:
  - event: push
  - event: pull_request

steps:
  check:
    image: denoland/deno:2.9.0
    commands:
      # Install git for the .gitignore checks (cli/init.test.ts runs
      # `git check-ignore`) and worktree/hook fixtures elsewhere. `age`
      # is no longer needed: encryption runs in-process
      # (@spy4x/server/env-age64), no binary on PATH required.
      - apt-get update && apt-get install -y git
      - deno task check
