when:
  - event: push
  - event: pull_request

steps:
  check:
    image: denoland/deno:2.9.0
    commands:
      # Install age for the encryption tests (cli/encrypt.test.ts assumes
      # age + age-keygen are on PATH) and git for the .gitignore checks
      # (cli/init.test.ts runs `git check-ignore`). The slim image ships
      # with neither; both match the dev box environment.
      - apt-get update && apt-get install -y age git
      - deno task check
