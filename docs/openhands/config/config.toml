# OpenHands Model Configuration
# Master = deepseek-v4-pro, Subagents = deepseek-v4-flash, Escalation = minimax-m3

[core]
max_iterations = 100
workspace_base = "./workspace"

# === Default LLM (Master Agent) ===
[llm]
model = "deepseek-v4-pro"
api_key = "${DEEPSEEK_API_KEY}"
base_url = "https://api.deepseek.com/v1"
temperature = 0.2
max_tokens = 8192

# === Subagent Configuration ===
[llm.subagent]
model = "deepseek-v4-flash"
api_key = "${DEEPSEEK_API_KEY}"
base_url = "https://api.deepseek.com/v1"
temperature = 0.0   # deterministic for isolated tasks
max_tokens = 4096
max_retries = 1     # fail fast, escalate to master

# === Escalation (use by overriding model per-run) ===
# Override with: OPENHANDS_LLM_MODEL=minimax-m3
# Or set env: export ESCALATE_MODEL="minimax-m3"
