networks:
  proxy:
    external: true
  default:
    external: true
    name: proxy

services:
  # Grafana - Metrics dashboard & observability
  # https://github.com/grafana/grafana
  grafana:
    container_name: hl-grafana
    image: grafana/grafana:latest
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - GF_SERVER_ROOT_URL=https://metrics.${DOMAIN}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=X-Forwarded-User
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true
      - GF_AUTH_PROXY_WHITELIST=*
    volumes:
      - ${VOLUMES_PATH}/grafana/data:/var/lib/grafana:z
      - ${PATH_APPS}/configs/grafana/datasources:/etc/grafana/provisioning/datasources:ro,z
      - ${PATH_APPS}/configs/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro,z
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.hl-grafana.loadbalancer.server.port=3000"
      - "traefik.http.routers.hl-grafana.rule=Host(`metrics.${DOMAIN}`)"
      - "traefik.http.routers.hl-grafana.entrypoints=websecure"
      - "traefik.http.routers.hl-grafana.tls=true"
      - "traefik.http.routers.hl-grafana.middlewares=authelia@file,robots-deny@file"
      - "traefik.http.routers.hl-grafana.tls.certresolver=myresolver"
