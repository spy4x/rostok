networks:
  proxy:
    external: true
  default:
    external: true
    name: proxy

services:
  open-webui:
    container_name: hl-open-webui
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # --- Web page loader ---
      # Empty = Open WebUI's built-in loader. "playwright" needs the playwright stack and its URL.
      - WEB_LOADER_ENGINE=${OPEN_WEBUI_WEB_LOADER_ENGINE:-}
      - PLAYWRIGHT_WS_URL=${OPEN_WEBUI_PLAYWRIGHT_WS_URL:-}
      - PLAYWRIGHT_TIMEOUT=5000
      # Off by default: when on, any signed-in user can have Open WebUI fetch a private address
      # (another container, a device on the LAN) and read the answer in the chat.
      - ENABLE_RAG_LOCAL_WEB_FETCH=${OPEN_WEBUI_ENABLE_RAG_LOCAL_WEB_FETCH:-false}

      # --- Web Search ---
      # Off by default: the engine below is the searxng stack, which may not be on this server.
      - ENABLE_WEB_SEARCH=${OPEN_WEBUI_ENABLE_WEB_SEARCH:-false}
      - WEB_SEARCH_ENGINE=${OPEN_WEBUI_WEB_SEARCH_ENGINE:-searxng}
      - SEARXNG_QUERY_URL=${OPEN_WEBUI_SEARXNG_QUERY_URL:-http://searxng:8080/search?format=json}
      - WEB_SEARCH_RESULT_COUNT=${OPEN_WEBUI_WEB_SEARCH_RESULT_COUNT:-3}
      - BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL=${OPEN_WEBUI_BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL:-true}

      # --- Native Mode (Agentic Mode) for all models ---
      # Unlocks built-in system tools: time, calendar, memory, fetch, web search, etc.
      - "DEFAULT_MODEL_PARAMS={\"function_calling\":\"native\"}"

      # --- Feature Toggles ---
      # Calendar: AI can create/search events, requires WEBUI_URL
      - WEBUI_URL=https://${OPEN_WEBUI_DOMAIN}
      - ENABLE_CALENDAR=true
      - ENABLE_MEMORIES=true
      - ENABLE_NOTES=true

      # --- Image Generation (through an OpenAI-compatible API) ---
      # Off by default: it needs a provider that serves an image model, named in the variable.
      - ENABLE_IMAGE_GENERATION=${OPEN_WEBUI_ENABLE_IMAGE_GENERATION:-false}
      - IMAGE_GENERATION_ENGINE=openai
      - IMAGE_GENERATION_MODEL=${OPEN_WEBUI_IMAGE_GENERATION_MODEL:-}
      - IMAGE_SIZE=1024x1024
      - "IMAGES_OPENAI_API_PARAMS={\"quality\":\"low\"}"

      # --- MCP + OpenAPI Tool Servers ---
      # mcpo (below, part of this stack) proxies stdio MCP servers → OpenAPI. Each tool gets its
      # own route + OpenAPI spec, and both are always on.
      # The other five entries are MCP servers of sibling stacks. Each is off ("enable":false)
      # until its OPEN_WEBUI_ENABLE_<NAME>_MCP variable is "true", so nothing here points at a
      # stack this server does not run.
      # Bearer keys: the mcpo routes send OPEN_WEBUI_MCPO_API_KEY, the caldav-mcp route sends
      # OPEN_WEBUI_CALDAV_MCP_TOKEN (set to ${CALDAV_MCP_TOKEN} in the server's .env), and the
      # email-mcp route sends OPEN_WEBUI_EMAIL_MCP_TOKEN (set to ${EMAIL_MCP_TOKEN}).
      # The email-mcp entry (spy4x/rostok#143) has no access grants, which Open WebUI reads as
      # admins only, and sends the signed-in user's e-mail address in X-OpenWebUI-User-Email, from
      # which the email-mcp guard decides who may change mail (EMAIL_MCP_ALLOWED_USERS).
      - TOOL_SERVER_CONNECTIONS=[{"url":"http://hl-playwright-mcp:8099","path":"/mcp","type":"mcp","auth_type":"none","key":"","config":{"enable":${OPEN_WEBUI_ENABLE_PLAYWRIGHT_MCP:-false},"access_grants":[{"principal_type":"user","principal_id":"*","permission":"read"}]},"headers":{"Accept":"application/json, text/event-stream","Content-Type":"application/json"}},{"url":"http://mcpo:8000/youtube-transcript","path":"openapi.json","type":"openapi","spec_type":"url","auth_type":"bearer","key":"${OPEN_WEBUI_MCPO_API_KEY}","config":{"enable":true,"access_grants":[{"principal_type":"user","principal_id":"*","permission":"read"}]},"info":{"name":"YouTube Transcript","description":"Fetch YouTube video transcripts"}},{"url":"http://mcpo:8000/fetch","path":"openapi.json","type":"openapi","spec_type":"url","auth_type":"bearer","key":"${OPEN_WEBUI_MCPO_API_KEY}","config":{"enable":true,"access_grants":[{"principal_type":"user","principal_id":"*","permission":"read"}]},"info":{"name":"Web Fetch","description":"Fetch any URL as HTML, Markdown, or plain text"}},{"url":"http://hl-caldav-mcp:3000/mcp","type":"mcp","auth_type":"bearer","key":"${OPEN_WEBUI_CALDAV_MCP_TOKEN:-}","config":{"enable":${OPEN_WEBUI_ENABLE_CALDAV_MCP:-false},"access_grants":[{"principal_type":"user","principal_id":"*","permission":"read"}]},"headers":{"Accept":"application/json, text/event-stream","Content-Type":"application/json"},"info":{"id":"caldav-mcp","name":"CalDAV MCP","description":"CalDAV MCP server - todos, events, calendars"}},{"url":"http://hl-email-mcp:9557/mcp","type":"mcp","auth_type":"bearer","key":"${OPEN_WEBUI_EMAIL_MCP_TOKEN:-}","config":{"enable":${OPEN_WEBUI_ENABLE_EMAIL_MCP:-false},"access_grants":[]},"headers":{"Accept":"application/json, text/event-stream","Content-Type":"application/json","X-OpenWebUI-User-Email":"{{USER_EMAIL}}"},"info":{"id":"email-mcp","name":"Email MCP","description":"IMAP + SMTP via your own mailserver"}},{"url":"http://hl-google-maps-mcp:3000/mcp","type":"mcp","auth_type":"none","config":{"enable":${OPEN_WEBUI_ENABLE_GOOGLE_MAPS_MCP:-false},"access_grants":[{"principal_type":"user","principal_id":"*","permission":"read"}]},"headers":{"Accept":"application/json, text/event-stream","Content-Type":"application/json"},"info":{"id":"google-maps-mcp","name":"Google Maps","description":"Places search, geocoding, directions, weather via Google Maps Platform"}},{"url":"http://hl-github-mcp:3000/mcp","type":"mcp","auth_type":"none","key":"","config":{"enable":${OPEN_WEBUI_ENABLE_GITHUB_MCP:-false},"access_grants":[{"principal_type":"user","principal_id":"*","permission":"read"}]},"headers":{"Accept":"application/json, text/event-stream","Content-Type":"application/json"},"info":{"id":"github-mcp","name":"GitHub MCP","description":"GitHub API access — repos, issues, PRs, Actions, code search"}}]
      - USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS=true

      # --- HuggingFace ---
      - HF_TOKEN=${OPEN_WEBUI_HF_TOKEN}

      # --- LLM Providers (OpenAI-compatible) ---
      # Both empty on a server that only uses Ollama.
      - OPENAI_API_KEYS=${OPEN_WEBUI_OPENAI_API_KEYS:-}
      - OPENAI_API_BASE_URLS=${OPEN_WEBUI_OPENAI_API_BASE_URLS:-}
      # Optional whitelist of models per provider, as JSON keyed by the provider's position in the
      # lists above. Empty = every model a provider returns is listed. See the README.
      - OPENAI_API_CONFIGS=${OPEN_WEBUI_OPENAI_API_CONFIGS:-}

      # --- Ollama Local LLM ---
      # Off by default: the URLs below are the ollama stack, which may not be on this server.
      - ENABLE_OLLAMA_API=${OPEN_WEBUI_ENABLE_OLLAMA_API:-false}
      - OLLAMA_API_BASE_URL=${OPEN_WEBUI_OLLAMA_API_BASE_URL:-http://ollama:11434}
      - OLLAMA_BASE_URL=${OPEN_WEBUI_OLLAMA_BASE_URL:-http://ollama:11434}

      # --- Default Model Settings ---
      # Comma-separated model ids preselected in a new chat. Empty = the user picks. When set,
      # init-models.py also hides every other model record of the workspace. See the README.
      - DEFAULT_MODELS=${OPEN_WEBUI_DEFAULT_MODELS:-}
      - "DEFAULT_MODEL_METADATA={\"capabilities\":{\"vision\":true,\"file_upload\":true,\"file_context\":true,\"web_search\":true,\"image_generation\":true,\"code_interpreter\":true},\"defaultFeatureIds\":[\"image_generation\"]}"
      - DEFAULT_USER_ROLE=${OPEN_WEBUI_DEFAULT_USER_ROLE:-user}
      - ENABLE_SIGNUP=${OPEN_WEBUI_ENABLE_SIGNUP:-false}
      - ENABLE_LOGIN_FORM=${OPEN_WEBUI_ENABLE_LOGIN_FORM:-true}

      # --- RAG Document Extraction ---
      # Empty = Open WebUI's built-in extractor. "tika" needs a Tika server, which this catalog
      # does not ship, and its URL.
      - CONTENT_EXTRACTION_ENGINE=${OPEN_WEBUI_CONTENT_EXTRACTION_ENGINE:-}
      - TIKA_SERVER_URL=${OPEN_WEBUI_TIKA_SERVER_URL:-}
      - RAG_TOP_K=${OPEN_WEBUI_RAG_TOP_K:-10}
      - RAG_FILE_MAX_COUNT=${OPEN_WEBUI_RAG_FILE_MAX_COUNT:-10}
      - RAG_FILE_MAX_SIZE=${OPEN_WEBUI_RAG_FILE_MAX_SIZE:-52428800}

      # --- User Permissions ---
      - USER_PERMISSIONS_FEATURES_WEB_SEARCH=true
      - USER_PERMISSIONS_FEATURES_CALENDAR=true
      - USER_PERMISSIONS_FEATURES_MEMORIES=true
      - USER_PERMISSIONS_FEATURES_NOTES=true
      - USER_PERMISSIONS_FEATURES_IMAGE_GENERATION=true
      - USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS=true
      - USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS=true

      # --- Config persistence ---
      # Set to false to force env vars to override DB config
      - ENABLE_PERSISTENT_CONFIG=${OPEN_WEBUI_ENABLE_PERSISTENT_CONFIG:-false}

      # --- Auth (if not using OAuth) ---
      - WEBUI_NAME=${OPEN_WEBUI_WEBUI_NAME:-Homelab AI}
      - WEBUI_SECRET_KEY=${OPEN_WEBUI_WEBUI_SECRET_KEY}
    volumes:
      - ${VOLUMES_PATH}/open-webui:/app/backend/data:z
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.hl-open-webui.loadbalancer.server.port=8080"
      - "traefik.http.routers.hl-open-webui.rule=Host(`${OPEN_WEBUI_DOMAIN}`)"
      - "traefik.http.routers.hl-open-webui.middlewares=frame-deny@file,robots-deny@file"
      - "traefik.http.routers.hl-open-webui.entrypoints=websecure"
      - "traefik.http.routers.hl-open-webui.tls=true"
      - "traefik.http.routers.hl-open-webui.tls.certresolver=myresolver"

  # --- MCP Proxy (bridges stdio MCP servers to OpenAPI HTTP for Open WebUI) ---
  # Built from Dockerfile.mcpo: the mcpo image with both tool servers installed at fixed versions,
  # so a start downloads nothing (spy4x/rostok#410). The config file starts the installed commands.
  mcpo:
    container_name: hl-mcpo
    build:
      context: .
      dockerfile: Dockerfile.mcpo
      args:
        # The base image's tag. Its default is the one in Dockerfile.mcpo; change both together.
        MCPO_IMAGE_TAG: ${OPEN_WEBUI_MCPO_IMAGE_TAG:-git-788ff92}
    # Healthy once both tool servers started: mcpo serves a tool's spec even when its server failed
    # to start, but then with no paths, so the check asserts that each spec lists some.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import json, urllib.request as u; assert all(json.load(u.urlopen(f'http://127.0.0.1:8000/{t}/openapi.json', timeout=5))['paths'] for t in ('youtube-transcript', 'fetch'))"
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    command: ["--config", "/config/mcp-servers.json", "--api-key", "${OPEN_WEBUI_MCPO_API_KEY:?}"]
    volumes:
      - ./mcpo-config.json:/config/mcp-servers.json:ro
    networks:
      - proxy
