# Not on the shared `proxy` network: every container behind Traefik is on it, and this API has no
# authentication and allows container create and exec, so any one of them could take the host.
networks:
  # Only this proxy and the containers whose stack names `hl-docker-api` as an external network are
  # on it. Internal: no route out. The fixed name is what those stacks reference.
  docker-api:
    name: hl-docker-api
    internal: true

services:
  docker-sock-proxy:
    container_name: hl-docker-sock-proxy
    image: tecnativa/docker-socket-proxy:${DOCKER_SOCK_PROXY_IMAGE_TAG:-latest}
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Security: explicitly deny dangerous endpoints
      - AUTH=0
      - SECRETS=0
      - BUILD=0
      - COMMIT=0
      - SWARM=0
      - NODES=0
      - TASKS=0
      - SERVICES=0
      - CONFIGS=0
      - PLUGINS=0
      - PRUNE=0
      - GRPC=0
      - SESSION=0
      - DISTRIBUTION=0
      - SYSTEM=0
      # Grant only what's needed for Docker access
      - CONTAINERS=1
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTART=1
      - ALLOW_CREATE=1
      - ALLOW_REMOVE=1
      - ALLOW_INSPECT=1
      - ALLOW_ATTACH=1
      - ALLOW_EXEC=1
      - ALLOW_LOGS=1
      - ALLOW_KILL=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - INFO=1
      - VERSION=1
      - EVENTS=1
      # Allow POST/PUT/DELETE for granted endpoints
      - POST=1
    networks:
      - docker-api
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
    security_opt:
      - no-new-privileges:true
