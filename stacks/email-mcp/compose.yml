networks:
  # Open WebUI's way in: only the guard and Open WebUI (connected by that stack's after.deploy.ts)
  # are on it. Its name is what Open WebUI connects to, so it stays the same.
  mcp:
    name: hl-email-mcp
  # Between the guard and the upstream server, and nothing else. Internal: no way out through it.
  upstream:
    name: hl-email-mcp-upstream
    internal: true
  # The upstream server's way out to the mail host (IMAP and SMTP). No other container joins it,
  # so nothing can reach the upstream server through it.
  egress:
    name: hl-email-mcp-egress

services:
  # The guard (guard/): the only way to the mail tools. It asks for EMAIL_MCP_TOKEN, passes only
  # the allowed tools, and lets only EMAIL_MCP_ALLOWED_USERS change mail (spy4x/rostok#143).
  # It keeps the service name and the container name the server used to have, so Open WebUI's URL
  # http://hl-email-mcp:9557/mcp is unchanged and a deploy replaces the old container in place.
  email-mcp:
    container_name: hl-email-mcp
    build:
      context: ./guard
    restart: unless-stopped
    environment:
      - EMAIL_MCP_TOKEN=${EMAIL_MCP_TOKEN:?}
      - EMAIL_MCP_ALLOWED_USERS=${EMAIL_MCP_ALLOWED_USERS:-}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"
    # No swap, as for upstream below: out of memory, it is killed and restarted, never left hanging.
    memswap_limit: 128M
    networks:
      - mcp
      - upstream
    labels:
      - "traefik.enable=false"
    depends_on:
      upstream:
        condition: service_healthy
    healthcheck:
      # 200 only with a valid token configured; it does not call upstream. busybox wget exits
      # non-zero on any other status.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9557/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Email MCP — IMAP + SMTP for AI assistants, behind the guard above.
  # Source: https://github.com/ai-zerolab/mcp-email-server (BSD-3-Clause)
  # Multi-account via TOML config (rendered by before.deploy.ts).
  # Speaks Streamable HTTP on port 9557 and asks for no credential, so only the guard reaches it.
  upstream:
    container_name: hl-email-mcp-upstream
    image: ghcr.io/ai-zerolab/mcp-email-server:${EMAIL_MCP_IMAGE_TAG:-latest}
    # Start the program the image already holds. The image's own entrypoint, `uv run`, builds the
    # project again at every start and fetches its build tool from PyPI, with no version: the
    # container would run whatever PyPI serves that day, and not start at all without it.
    # Stateless HTTP: upstream otherwise keeps every MCP session in memory until it restarts, and
    # the healthcheck alone opens one every 30 seconds. About 45 MiB per 1000 sessions filled the
    # memory limit in a day and a half, then the server hung. No setting turns this on, so the
    # entrypoint sets it before the CLI starts; a setting upstream drops fails the start loudly.
    entrypoint: [
      "tini",
      "--",
      "/app/.venv/bin/python",
      "-c",
      "from mcp_email_server.app import mcp; mcp.settings.stateless_http = True; from mcp_email_server.cli import app; app()",
    ]
    command: ["streamable-http"]
    restart: unless-stopped
    environment:
      # --- HTTP transport ---
      - MCP_HOST=0.0.0.0
      - MCP_PORT=9557
      # The guard calls it by this name. DNS rebinding protection enabled (default). Bare host
      # entries allow any port.
      - MCP_ALLOWED_HOSTS=hl-email-mcp-upstream:*,localhost:*,127.0.0.1:*
      - MCP_ALLOWED_ORIGINS=http://hl-email-mcp-upstream:*,http://localhost:*,http://127.0.0.1:*
      - MCP_ENABLE_DNS_REBINDING_PROTECTION=true

      # --- Multi-account config (rendered by before.deploy.ts from the EMAIL_MCP_* keys) ---
      - MCP_EMAIL_SERVER_CONFIG_PATH=/config.toml
    volumes:
      # Rendered by before.deploy.ts; mode 0600 on disk.
      # Keep this a single-file mount, never the folder: upstream's add_email_account saves by
      # renaming a temporary file over the config file, which cannot work on a mounted file. That
      # failure is a second lock behind the guard, which refuses add_email_account outright
      # (spy4x/rostok#143).
      - ./config.toml:/config.toml:ro
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.3"
    # No swap on top of the memory limit. With swap the kernel kept paging instead of killing, and
    # the server hung for days with nothing to restart it; now it is killed and `restart` brings
    # it back.
    memswap_limit: 256M
    security_opt:
      - no-new-privileges:true
    networks:
      - upstream
      - egress
    labels:
      # Internal MCP — no Traefik exposure. Only the guard reaches it.
      - "traefik.enable=false"
    healthcheck:
      # MCP Streamable HTTP — send initialize, expect 200 with "result" key. Stateless (see the
      # entrypoint), so a check leaves no session behind.
      test: [
        "CMD",
        "python",
        "-c",
        "import urllib.request, json; b=json.dumps({'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2024-11-05','capabilities':{},'clientInfo':{'name':'hc','version':'1'}}}).encode(); r=urllib.request.Request('http://localhost:9557/mcp', data=b, headers={'Content-Type':'application/json','Accept':'application/json, text/event-stream'}); resp=urllib.request.urlopen(r, timeout=5); assert resp.status==200; assert b'result' in resp.read()",
      ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
