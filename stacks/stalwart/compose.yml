name: ${PROJECT}

networks:
  proxy:
    external: true
  default:
    external: true
    name: proxy

services:
  # Stalwart Mail Server - Modern mail server with JMAP support
  # NOTE: This stack replaces the existing mailserver stack. Stop mailserver before enabling.
  stalwart:
    container_name: hl-stalwart
    image: stalwartlabs/stalwart:latest
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
    environment:
      - TZ=${TIMEZONE:-UTC}
      - STALWART_RECOVERY_ADMIN=admin:${STALWART_ADMIN_PASSWORD}
    volumes:
      - ${VOLUMES_PATH}/stalwart/data:/opt/stalwart-mail/data:z
      - ${VOLUMES_PATH}/stalwart/config:/etc/stalwart:z
      - ${VOLUMES_PATH}/stalwart/lib:/var/lib/stalwart:z
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${STALWART_MEM_LIMIT:-512M}
          cpus: ${STALWART_CPU_LIMIT:-0.5}
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.hl-stalwart.loadbalancer.server.port=8080"
      - "traefik.http.routers.hl-stalwart.rule=Host(`${STALWART_SUBDOMAIN:-stalwart}.${DOMAIN}`)"
      - "traefik.http.routers.hl-stalwart.entrypoints=websecure"
      - "traefik.http.routers.hl-stalwart.tls=true"
      - "traefik.http.routers.hl-stalwart.tls.certresolver=myresolver"
      - "traefik.http.middlewares.hl-stalwart-redirect.redirectregex.regex=^(https?://[^/]+)/?$$"
      - "traefik.http.middlewares.hl-stalwart-redirect.redirectregex.replacement=$${1}/admin"
      - "traefik.http.middlewares.hl-stalwart-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.hl-stalwart.middlewares=hl-stalwart-redirect,robots-deny@file"
