name: ${PROJECT}

networks:
  proxy:
    external: true
  default:
    external: true
    name: proxy

services:
  # Stalwart Mail Server - Modern mail server with JMAP support
  stalwart:
    container_name: hl-stalwart
    image: stalwartlabs/stalwart:latest
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - TZ=${TIMEZONE:-UTC}
      - STALWART_RECOVERY_ADMIN=admin:${STALWART_ADMIN_PASSWORD}
    volumes:
      - ${VOLUMES_PATH}/stalwart/data:/opt/stalwart-mail/data:z
      - ${VOLUMES_PATH}/stalwart/config:/etc/stalwart:z
      - ${VOLUMES_PATH}/stalwart/lib:/var/lib/stalwart:z
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${STALWART_MEM_LIMIT:-512M}
          cpus: ${STALWART_CPU_LIMIT:-0.5}
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy

  # Nginx sidecar — proxies to stalwart:8080 for Traefik.
  # Traefik's Go HTTP client has issues reaching stalwart directly,
  # so this sidecar bridges the gap. Routes exposed:
  #   /         → redirect to /admin
  #   /admin    → stalwart admin UI
  #   /jmap     → JMAP API
  stalwart-proxy:
    container_name: hl-stalwart-proxy
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx-stalwart.conf:/etc/nginx/conf.d/default.conf:ro,z
    networks:
      - proxy
    deploy:
      resources:
        limits:
          memory: 16M
          cpus: "0.1"
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.hl-stalwart.rule=Host(`mail.antonshubin.com`)"
      - "traefik.http.routers.hl-stalwart.entrypoints=websecure"
      - "traefik.http.routers.hl-stalwart.tls=true"
      - "traefik.http.routers.hl-stalwart.tls.certresolver=myresolver"
      - "traefik.http.routers.hl-stalwart.middlewares=robots-deny@file"
