name: ${PROJECT}

networks:
  proxy:
    external: true
  default:
    external: true
    name: proxy

services:
  # Stalwart Mail Server - Modern mail server with JMAP support
  stalwart:
    container_name: hl-stalwart
    image: stalwartlabs/stalwart:latest
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      - "172.18.0.1:8080:8080"
    environment:
      - TZ=${TIMEZONE:-UTC}
      - STALWART_RECOVERY_ADMIN=admin:${STALWART_ADMIN_PASSWORD}
    volumes:
      - ${VOLUMES_PATH}/stalwart/data:/opt/stalwart-mail/data:z
      - ${VOLUMES_PATH}/stalwart/config:/etc/stalwart:z
      - ${VOLUMES_PATH}/stalwart/lib:/var/lib/stalwart:z
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${STALWART_MEM_LIMIT:-512M}
          cpus: ${STALWART_CPU_LIMIT:-0.5}
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # Shared backend via host gateway (bypasses Docker inter-container issue)
      - "traefik.http.services.hl-stalwart.loadbalancer.server.url=http://172.18.0.1:8080"
      # Single router on webmail.DOMAIN → /account (admin at /admin)
      - "traefik.http.routers.hl-stalwart-webmail.rule=Host(`webmail.${DOMAIN}`)"
      - "traefik.http.routers.hl-stalwart-webmail.entrypoints=websecure"
      - "traefik.http.routers.hl-stalwart-webmail.tls=true"
      - "traefik.http.routers.hl-stalwart-webmail.tls.certresolver=myresolver"
      - "traefik.http.routers.hl-stalwart-webmail.service=hl-stalwart"
      - "traefik.http.routers.hl-stalwart-webmail.middlewares=robots-deny@file"
