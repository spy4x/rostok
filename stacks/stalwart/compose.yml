name: ${PROJECT}

networks:
  proxy:
    external: true
  default:
    external: true
    name: proxy

services:
  # Stalwart Mail Server - Modern mail server with JMAP support
  stalwart:
    container_name: hl-stalwart
    image: stalwartlabs/stalwart:latest
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      # Internal HTTP port published on Docker host gateway for Traefik (different compose stack)
      - "172.18.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - TZ=${TIMEZONE:-UTC}
      - STALWART_RECOVERY_ADMIN=admin:${STALWART_ADMIN_PASSWORD}
    volumes:
      - ${VOLUMES_PATH}/stalwart/data:/opt/stalwart-mail/data:z
      - ${VOLUMES_PATH}/stalwart/config:/etc/stalwart:z
      - ${VOLUMES_PATH}/stalwart/lib:/var/lib/stalwart:z
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${STALWART_MEM_LIMIT:-512M}
          cpus: ${STALWART_CPU_LIMIT:-0.5}
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # Stalwart runs in its own compose stack; Traefik (separate stack) can't
      # resolve service-name DNS across stacks. 8080 published on Docker host
      # gateway (172.18.0.1) lets Traefik reach it reliably.
      - "traefik.http.services.hl-stalwart.loadbalancer.server.url=http://172.18.0.1:8080"
      - "traefik.http.services.hl-stalwart.loadbalancer.healthCheck.path=/healthz/live"
      - "traefik.http.services.hl-stalwart.loadbalancer.healthCheck.interval=30s"
      # Web UI + JMAP on mail.DOMAIN → Stalwart backend
      - "traefik.http.routers.hl-stalwart.rule=Host(`mail.${DOMAIN}`)"
      - "traefik.http.routers.hl-stalwart.entrypoints=websecure"
      - "traefik.http.routers.hl-stalwart.tls=true"
      - "traefik.http.routers.hl-stalwart.tls.certresolver=myresolver"
      # stalwart-jmap middleware provides COEP/CORS headers for cross-origin JMAP (Bulwark)
      - "traefik.http.routers.hl-stalwart.middlewares=stalwart-jmap@file,robots-deny@file"

  # MTA-STS policy server — serves .well-known/mta-sts.txt for TLS enforcement
  # Covers mta-sts.antonshubin.com and mta-sts.neatsoft.dev (same MX)
  mta-sts:
    container_name: hl-mta-sts
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./mta-sts/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./mta-sts/html:/usr/share/nginx/html:ro
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.1"
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.hl-mta-sts.loadbalancer.server.port=8081"
      # MTA-STS for antonshubin.com
      - "traefik.http.routers.hl-mta-sts-antonshubin.rule=Host(`mta-sts.antonshubin.com`)"
      - "traefik.http.routers.hl-mta-sts-antonshubin.entrypoints=websecure"
      - "traefik.http.routers.hl-mta-sts-antonshubin.tls=true"
      - "traefik.http.routers.hl-mta-sts-antonshubin.tls.certresolver=myresolver"
      # MTA-STS for neatsoft.dev
      - "traefik.http.routers.hl-mta-sts-neatsoft.rule=Host(`mta-sts.neatsoft.dev`)"
      - "traefik.http.routers.hl-mta-sts-neatsoft.entrypoints=websecure"
      - "traefik.http.routers.hl-mta-sts-neatsoft.tls=true"
      - "traefik.http.routers.hl-mta-sts-neatsoft.tls.certresolver=myresolver"

  # Synchronizes Let's Encrypt certs from Traefik's acme.json into Stalwart
  cert-sync:
    container_name: hl-cert-sync
    image: python:3-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
          echo "15 3 * * * cd / && python3 /script.py" | crontab -
          exec crond -f -l 2
    volumes:
      - ${PATH_APPS}/stacks/stalwart/cert-sync.py:/script.py:ro,z
      - ${VOLUMES_PATH}/traefik/letsencrypt/acme.json:/acme.json:ro,z
      - ${VOLUMES_PATH}/stalwart/cert-sync-state:/root/.cache/stalwart-cert-sync:z
    environment:
      - ACME_PATH=/acme.json
      - STALWART_PASSWORD=${STALWART_ADMIN_PASSWORD}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
