name: ${PROJECT}

networks:
  proxy:
    external: true
  default:
    external: true
    name: proxy

services:
  # Stalwart Mail Server - Modern mail server with JMAP support
  stalwart:
    container_name: hl-stalwart
    image: stalwartlabs/stalwart:latest
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - TZ=${TIMEZONE:-UTC}
      - STALWART_RECOVERY_ADMIN=admin:${STALWART_ADMIN_PASSWORD}
    volumes:
      - ${VOLUMES_PATH}/stalwart/data:/opt/stalwart-mail/data:z
      - ${VOLUMES_PATH}/stalwart/config:/etc/stalwart:z
      - ${VOLUMES_PATH}/stalwart/lib:/var/lib/stalwart:z
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${STALWART_MEM_LIMIT:-512M}
          cpus: ${STALWART_CPU_LIMIT:-0.5}
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # Use Python sidecar as backend: Traefik → sidecar (Python urllib) → Stalwart.
      # Works around Go (Traefik/Alpine 3.23) ↔ Rust (Stalwart) HTTP interaction
      # that causes connection resets on certain Docker IPs.
      - "traefik.http.services.hl-stalwart.loadbalancer.server.url=http://hl-stalwart-proxy:8080"
      - "traefik.http.services.hl-stalwart.loadbalancer.healthCheck.path=/healthz/live"
      - "traefik.http.services.hl-stalwart.loadbalancer.healthCheck.interval=30s"
      # Web UI + JMAP on mail.DOMAIN → Stalwart backend
      - "traefik.http.routers.hl-stalwart.rule=Host(`mail.${DOMAIN}`) && !PathPrefix(`/dav/`)"
      - "traefik.http.routers.hl-stalwart.entrypoints=websecure"
      - "traefik.http.routers.hl-stalwart.tls=true"
      - "traefik.http.routers.hl-stalwart.tls.certresolver=myresolver"
      # stalwart-jmap middleware provides COEP/CORS headers for cross-origin JMAP (Bulwark)
      - "traefik.http.routers.hl-stalwart.middlewares=stalwart-jmap@file,robots-deny@file"
      # CalDAV/CardDAV on mail.DOMAIN/dav → same Stalwart backend (no JMAP middleware
      # which can interfere with PROPFIND/REPORT methods).
      - "traefik.http.routers.hl-stalwart-dav.rule=Host(`mail.${DOMAIN}`) && PathPrefix(`/dav/`)"
      - "traefik.http.routers.hl-stalwart-dav.entrypoints=websecure"
      - "traefik.http.routers.hl-stalwart-dav.tls=true"
      - "traefik.http.routers.hl-stalwart-dav.tls.certresolver=myresolver"
      - "traefik.http.routers.hl-stalwart-dav.middlewares=robots-deny@file"
      - "traefik.http.routers.hl-stalwart-dav.service=hl-stalwart"
      # CalDAV/CardDAV on cal.DOMAIN → same Stalwart backend
      - "traefik.http.routers.hl-stalwart-caldav.rule=Host(`cal.${DOMAIN}`)"
      - "traefik.http.routers.hl-stalwart-caldav.entrypoints=websecure"
      - "traefik.http.routers.hl-stalwart-caldav.tls=true"
      - "traefik.http.routers.hl-stalwart-caldav.tls.certresolver=myresolver"
      - "traefik.http.routers.hl-stalwart-caldav.middlewares=robots-deny@file"
      - "traefik.http.routers.hl-stalwart-caldav.service=hl-stalwart"

  # Python HTTP proxy sidecar: Traefik (Alpine 3.23 BusyBox wget) cannot reliably
  # connect to Stalwart's Rust HTTP server. Python urllib (Alpine 3.24) can.
  # Bridges HTTP traffic from Traefik to Stalwart on the internal proxy network.
  # Fixed IP: 172.18.0.20 avoids a Docker network issue where IP .13 fails to
  # connect to Stalwart's HTTP server.
  stalwart-proxy:
    container_name: hl-stalwart-proxy
    image: python:3-alpine
    command: ["python3", "/proxy/stalwart-proxy.py", "8080"]
    volumes:
      - ${PATH_APPS}/stacks/stalwart/stalwart-proxy.py:/proxy/stalwart-proxy.py:ro,z
    restart: unless-stopped
    networks:
      proxy:
        ipv4_address: 172.18.0.20
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.1"
    healthcheck:
      test: [
        "CMD",
        "python3",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://hl-stalwart:8080/.well-known/jmap', timeout=3)",
      ]
      interval: 30s
      timeout: 5s
      retries: 3

  # Synchronizes Let's Encrypt certs from Traefik's acme.json into Stalwart
  cert-sync:
    container_name: hl-cert-sync
    image: python:3-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
          echo "15 3 * * * cd / && python3 /script.py" | crontab -
          exec crond -f -l 2
    volumes:
      - ${PATH_APPS}/stacks/stalwart/cert-sync.py:/script.py:ro,z
      - ${VOLUMES_PATH}/traefik/letsencrypt/acme.json:/acme.json:ro,z
      - ${VOLUMES_PATH}/stalwart/cert-sync-state:/root/.cache/stalwart-cert-sync:z
    environment:
      - ACME_PATH=/acme.json
      - STALWART_PASSWORD=${STALWART_ADMIN_PASSWORD}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
