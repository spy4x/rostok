name: ${PROJECT}

networks:
  proxy:
    external: true
  default:
    external: true
    name: proxy

services:
  # Stalwart Mail Server - Modern mail server with JMAP support
  stalwart:
    container_name: hl-stalwart
    image: stalwartlabs/stalwart:latest
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      - "172.18.0.1:8080:8080"
    environment:
      - TZ=${TIMEZONE:-UTC}
      - STALWART_RECOVERY_ADMIN=admin:${STALWART_ADMIN_PASSWORD}
    volumes:
      - ${VOLUMES_PATH}/stalwart/data:/opt/stalwart-mail/data:z
      - ${VOLUMES_PATH}/stalwart/config:/etc/stalwart:z
      - ${VOLUMES_PATH}/stalwart/lib:/var/lib/stalwart:z
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${STALWART_MEM_LIMIT:-512M}
          cpus: ${STALWART_CPU_LIMIT:-0.5}
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # Shared backend via host gateway (bypasses Docker inter-container issue)
      - "traefik.http.services.hl-stalwart.loadbalancer.server.url=http://172.18.0.1:8080"
      # Webmail on webmail.DOMAIN → Stalwart UI (/account, /admin)
      - "traefik.http.routers.hl-stalwart-webmail.rule=Host(`webmail.${DOMAIN}`)"
      - "traefik.http.routers.hl-stalwart-webmail.entrypoints=websecure"
      - "traefik.http.routers.hl-stalwart-webmail.tls=true"
      - "traefik.http.routers.hl-stalwart-webmail.tls.certresolver=myresolver"
      - "traefik.http.routers.hl-stalwart-webmail.service=hl-stalwart"
      - "traefik.http.routers.hl-stalwart-webmail.middlewares=robots-deny@file"
      # JMAP API on mail.DOMAIN → Stalwart JMAP backend
      - "traefik.http.routers.hl-stalwart-jmap.rule=Host(`mail.${DOMAIN}`)"
      - "traefik.http.routers.hl-stalwart-jmap.entrypoints=websecure"
      - "traefik.http.routers.hl-stalwart-jmap.tls=true"
      - "traefik.http.routers.hl-stalwart-jmap.tls.certresolver=myresolver"
      - "traefik.http.routers.hl-stalwart-jmap.service=hl-stalwart"
      - "traefik.http.routers.hl-stalwart-jmap.middlewares=robots-deny@file"

  # Synchronizes Let's Encrypt certs from Traefik's acme.json into Stalwart
  cert-sync:
    container_name: hl-cert-sync
    image: python:3-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
          echo "15 3 * * * cd / && python3 /script.py" | crontab -
          exec crond -f -l 2
    volumes:
      - ${PATH_APPS}/stacks/stalwart/cert-sync.py:/script.py:ro,z
      - ${VOLUMES_PATH}/traefik/letsencrypt/acme.json:/acme.json:ro,z
      - ${VOLUMES_PATH}/stalwart/cert-sync-state:/root/.cache/stalwart-cert-sync:z
    environment:
      - ACME_PATH=/acme.json
      - STALWART_PASSWORD=${STALWART_ADMIN_PASSWORD}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
