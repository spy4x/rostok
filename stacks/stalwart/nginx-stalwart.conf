# Nginx reverse proxy for Stalwart Mail admin UI + JMAP.
# Traefik proxies to this nginx (port 80), nginx proxies to stalwart:8080.
server {
    listen 80;
    server_name _;

    # Redirect root to /admin
    location = / {
        return 301 /admin;
    }

    location / {
        proxy_pass http://hl-stalwart:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for EventSource (JMAP push)
        proxy_buffering off;

        # Pass through redirects
        proxy_redirect http://hl-stalwart:8080/ https://$host/;
    }
}
