networks:
  proxy:
    external: true
  default:
    external: true
    name: proxy

services:
  # caldav-mcp — lightweight CalDAV MCP server
  # Native Deno, zero npm deps, direct CalDAV protocol, proper VTODO/VEVENT support.
  caldav-mcp:
    container_name: hl-caldav-mcp
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # The binary may reach only this URL's host and claude.ai (Dockerfile --allow-net).
        CALDAV_URL: ${CALDAV_MCP_SERVER_URL}
    restart: unless-stopped
    # The same PUID:PGID the deploy chowns ${VOLUMES_PATH}/caldav-mcp to, never root
    # (spy4x/rostok#356). The binary needs no capability, writes only to /data and gains no new
    # privileges.
    user: "${PUID:-1000}:${PGID:-1000}"
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      - CALDAV_URL=${CALDAV_MCP_SERVER_URL}
      - CALDAV_USERNAME=${CALDAV_MCP_USERNAME}
      - CALDAV_PASSWORD=${CALDAV_MCP_PASSWORD}
      # The static token internal clients such as Open WebUI send. Blank means none: caldav-mcp then
      # needs OAuth and refuses to start in HTTP mode without either. With OAuth on it refuses this
      # token unless ALLOW_BEARER_TOKEN_WITH_OAUTH is true (README "Public with OAuth").
      - MCP_BEARER_TOKEN=${CALDAV_MCP_TOKEN:-}
      - ALLOW_BEARER_TOKEN_WITH_OAUTH=${CALDAV_MCP_ALLOW_TOKEN_WITH_OAUTH:-false}
      - HOST=0.0.0.0
      - PORT=3000
      - LOG_LEVEL=info
      # OAuth for remote connectors such as claude.ai (README "Public with OAuth"). caldav-mcp
      # switches it on when all three are set, refuses to start when only some are, and treats
      # blank as unset, so a server without them stays bearer-only.
      - PUBLIC_URL=${CALDAV_MCP_PUBLIC_URL:-}
      - OWNER_PASSWORD_HASH=${CALDAV_MCP_OWNER_PASSWORD_HASH:-}
      - AUTH_PEPPER=${CALDAV_MCP_AUTH_PEPPER:-}
      # Rate limits key on the client address in X-Forwarded-For, believed only from these CIDRs.
      # Name Traefik's fixed address alone (TRAEFIK_PROXY_IP, as <ip>/32): the whole proxy
      # network would let any container on it forge the address (README "Public with OAuth").
      - TRUSTED_PROXIES=${CALDAV_MCP_TRUSTED_PROXIES:-}
    volumes:
      # The OAuth store (Deno KV, /data/oauth.kv): connectors stay signed in across restarts.
      - ${VOLUMES_PATH}/caldav-mcp:/data:z
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"
    networks:
      - proxy
    labels:
      # Off unless the server sets CALDAV_MCP_PUBLIC=true; then MCP is at https://<domain>/mcp.
      - "traefik.enable=${CALDAV_MCP_PUBLIC:-false}"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.hl-caldav-mcp.loadbalancer.server.port=3000"
      - "traefik.http.routers.hl-caldav-mcp.rule=Host(`${CALDAV_MCP_DOMAIN:-mcp.${DOMAIN}}`)"
      - "traefik.http.routers.hl-caldav-mcp.entrypoints=websecure"
      - "traefik.http.routers.hl-caldav-mcp.tls=true"
      - "traefik.http.routers.hl-caldav-mcp.tls.certresolver=myresolver"
      # Compression still applies: the websecure entrypoint adds compression@file to every router,
      # and that middleware skips text/event-stream, so streamed (SSE) MCP responses are not held.
      - "traefik.http.routers.hl-caldav-mcp.middlewares=${CALDAV_MCP_MIDDLEWARES:-security-headers@file,robots-deny@file}"
