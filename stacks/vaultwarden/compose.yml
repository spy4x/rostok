networks:
  proxy:
    external: true
  default:
    external: true
    name: proxy

services:
  # Vaultwarden is a password manager which is compatible with Bitwarden clients.
  vaultwarden:
    container_name: hl-vaultwarden
    image: vaultwarden/server:${VAULTWARDEN_IMAGE_TAG:-latest}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - DOMAIN=https://${VAULTWARDEN_DOMAIN}
      # - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN} # Enable admin page only while needed and disable otherwise for better security
      - SIGNUPS_ALLOWED=${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      - INVITATIONS_ALLOWED=${VAULTWARDEN_INVITATIONS_ALLOWED}
      - SHOW_PASSWORD_HINT=${VAULTWARDEN_SHOW_PASSWORD_HINT}
      - LOGIN_RATELIMIT_MAX_BURST=${VAULTWARDEN_LOGIN_RATELIMIT_MAX_BURST}
      - LOGIN_RATELIMIT_SECONDS=${VAULTWARDEN_LOGIN_RATELIMIT_SECONDS}
      - INCOMPLETE_2FA_TIME_LIMIT=${VAULTWARDEN_INCOMPLETE_2FA_TIME_LIMIT}
      - LOG_LEVEL=${VAULTWARDEN_LOG_LEVEL}
      - EMERGENCY_ACCESS_ALLOWED=${VAULTWARDEN_EMERGENCY_ACCESS_ALLOWED}
      # SMTP configuration for email notifications
      - SMTP_HOST=${VAULTWARDEN_SMTP_HOST:-}
      - SMTP_PORT=${VAULTWARDEN_SMTP_PORT:-}
      - SMTP_FROM=${VAULTWARDEN_SMTP_FROM:-}
      - SMTP_USERNAME=${VAULTWARDEN_SMTP_USERNAME:-}
      - SMTP_PASSWORD=${VAULTWARDEN_SMTP_PASSWORD:-}
      - SMTP_SECURITY=starttls
      # Client address for login rate limits and logs. Traefik sets X-Real-Ip from the connection and
      # drops a visitor's own value; behind Cloudflare, see the README (spy4x/rostok#553).
      - IP_HEADER=${VAULTWARDEN_IP_HEADER:-X-Real-Ip}
    volumes:
      - ${VOLUMES_PATH}/vaultwarden:/data:z
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # Main service (handles both HTTP and WebSocket on port 80 since v1.29.0)
      - "traefik.http.services.hl-vaultwarden.loadbalancer.server.port=80"
      - "traefik.http.routers.hl-vaultwarden.rule=Host(`${VAULTWARDEN_DOMAIN}`)"
      - "traefik.http.routers.hl-vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.hl-vaultwarden.tls=true"
      - "traefik.http.routers.hl-vaultwarden.tls.certresolver=myresolver"
      - "traefik.http.routers.hl-vaultwarden.service=hl-vaultwarden"
      - "traefik.http.routers.hl-vaultwarden.middlewares=frame-deny@file,robots-deny@file"
