# No service joins the shared `proxy` network: the stack has no Traefik route, and neither store
# asks for a password, so a container on `proxy` could read every log and every metric.
networks:
  # The stack's own networks. Neither is external or renamed, so no other stack can declare them,
  # and both are internal: nothing on them needs a route out.
  # VictoriaMetrics, vmagent and the two exporters it scrapes.
  metrics:
    internal: true
  # VictoriaLogs and promtail, nothing else: every container's log is in that store.
  logs:
    internal: true

services:
  # ========================================================================
  # VictoriaMetrics Stack — primary observability pipeline.
  # Provides metrics (VictoriaMetrics), logs (VictoriaLogs), and
  # host/container-level exporters (node-exporter, cadvisor).
  # ========================================================================

  # VictoriaMetrics — single-binary Prometheus-compatible TSDB.
  # Drop-in for PromQL queries. Listens on 8428.
  victoria-metrics:
    container_name: hl-victoria-metrics
    image: victoriametrics/victoria-metrics:${VICTORIA_METRICS_IMAGE_TAG:-v1.146.0}
    command:
      - "--storageDataPath=/storage"
      - "--retentionPeriod=14"
      - "--httpListenAddr=:8428"
      - "--promscrape.config=/etc/vmagent/prometheus.yml"
      - "--graphiteListenAddr=:2003"
      - "--opentsdbListenAddr=:4242"
    volumes:
      - ${VOLUMES_PATH}/victoria-metrics/data:/storage:z
      - ${PATH_APPS}/configs/victoria-metrics/scrape.yml:/etc/vmagent/prometheus.yml:ro,z
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.3"
    security_opt:
      - no-new-privileges:true
    networks:
      - metrics

  # VMAgent — Prometheus-compatible scraper.
  # Pushes scraped metrics to VictoriaMetrics via remote write.
  vmagent:
    container_name: hl-vmagent
    image: victoriametrics/vmagent:${VICTORIA_METRICS_VMAGENT_IMAGE_TAG:-v1.146.0}
    command:
      - "-promscrape.config=/etc/vmagent/prometheus.yml"
      - "-remoteWrite.url=http://hl-victoria-metrics:8428/api/v1/write"
      - "-remoteWrite.maxDiskUsagePerURL=100MB"
    volumes:
      - ${PATH_APPS}/configs/victoria-metrics/scrape.yml:/etc/vmagent/prometheus.yml:ro,z
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"
    security_opt:
      - no-new-privileges:true
    networks:
      - metrics

  # VictoriaLogs — single-binary log database.
  # Replaces Loki. Compatible with LogsQL.
  victoria-logs:
    container_name: hl-victoria-logs
    image: victoriametrics/victoria-logs:${VICTORIA_METRICS_LOGS_IMAGE_TAG:-v1.51.0}
    command:
      - "--storageDataPath=/storage"
      - "--retentionPeriod=14"
      - "--httpListenAddr=:9428"
    volumes:
      - ${VOLUMES_PATH}/victoria-logs/data:/storage:z
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.3"
    security_opt:
      - no-new-privileges:true
    networks:
      - logs

  # Promtail — ships container logs to VictoriaLogs.
  promtail:
    container_name: hl-promtail
    image: grafana/promtail:${VICTORIA_METRICS_PROMTAIL_IMAGE_TAG:-3.2.1}
    volumes:
      - ${PATH_APPS}/configs/victoria-metrics/promtail.yml:/etc/promtail/config.yml:ro,z
      - /var/log:/var/log:ro,z
      - /var/lib/docker/containers:/var/lib/docker/containers:ro,z
      - /var/run/docker.sock:/var/run/docker.sock:ro,z
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"
    security_opt:
      - no-new-privileges:true
    networks:
      - logs

  # Node Exporter — host-level metrics (CPU, memory, disk, network)
  node-exporter:
    container_name: hl-node-exporter
    image: prom/node-exporter:${VICTORIA_METRICS_NODE_EXPORTER_IMAGE_TAG:-latest}
    volumes:
      - /proc:/host/proc:ro,z
      - /sys:/host/sys:ro,z
      - /:/rootfs:ro,z
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"
    networks:
      - metrics

  # cAdvisor — container-level metrics (resource usage per container)
  # NOTE: requires seccomp=unconfined for syscalls needed to read container stats
  cadvisor:
    container_name: hl-cadvisor
    image: gcr.io/cadvisor/cadvisor:${VICTORIA_METRICS_CADVISOR_IMAGE_TAG:-v0.49.2}
    volumes:
      - /:/rootfs:ro,z
      - /var/run:/var/run:ro,z
      - /sys:/sys:ro,z
      - /var/lib/docker:/var/lib/docker:ro,z
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.3"
    group_add:
      - "${DOCKER_GROUP_ID:-990}"
    security_opt:
      - seccomp=unconfined
      - label=type:container_runtime_t
    networks:
      - metrics
