name: ${PROJECT}
networks:
  proxy:
    external: true
  # Only Umami and its database. A service that lists no network joins the project's default
  # network, which every stack with `name: ${PROJECT}` shares, so the database gets its own.
  # `internal`: the database needs no route to the outside.
  umami-db:
    internal: true

services:
  # PostgreSQL for Umami
  umami-db:
    container_name: hl-umami-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD}
    volumes:
      - ${VOLUMES_PATH}/umami/db:/var/lib/postgresql/data:z
    networks:
      - umami-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # Umami - Privacy-first web analytics
  # https://umami.is
  umami:
    container_name: hl-umami
    image: ghcr.io/umami-software/umami:${UMAMI_IMAGE_TAG:-latest}
    environment:
      - DATABASE_TYPE=postgresql
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      - APP_SECRET=${UMAMI_APP_SECRET}
    depends_on:
      umami-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - umami-db
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.hl-umami.loadbalancer.server.port=3000"
      - "traefik.http.routers.hl-umami.rule=Host(`${UMAMI_DOMAIN:-stats.${DOMAIN}}`)"
      - "traefik.http.routers.hl-umami.middlewares=robots-deny@file"
      - "traefik.http.routers.hl-umami.entrypoints=websecure"
      - "traefik.http.routers.hl-umami.tls=true"
      - "traefik.http.routers.hl-umami.tls.certresolver=myresolver"
      # Proxy /umami/ through the main site's domain (ad-blocker and Safari ITP evasion).
      # The site must be served by this server's Traefik: UMAMI_PROXY_DOMAIN (and its www host)
      # then reach Umami at /umami/*. The prefix is stripped before Umami sees the request.
      - "traefik.http.middlewares.umami-stripprefix.stripprefix.prefixes=/umami"
      - "traefik.http.routers.hl-umami-proxy.rule=(Host(`${UMAMI_PROXY_DOMAIN:-${DOMAIN}}`) || Host(`${UMAMI_PROXY_WWW_DOMAIN:-www.${DOMAIN}}`)) && PathPrefix(`/umami/`)"
      - "traefik.http.routers.hl-umami-proxy.middlewares=umami-stripprefix,robots-deny@file"
      - "traefik.http.routers.hl-umami-proxy.entrypoints=websecure"
      - "traefik.http.routers.hl-umami-proxy.tls=true"
      - "traefik.http.routers.hl-umami-proxy.tls.certresolver=myresolver"
      - "traefik.http.routers.hl-umami-proxy.service=hl-umami"
