networks:
  proxy:
    external: true

services:
  # Woodpecker CI is a lightweight, self-hosted CI/CD platform.
  # It provides automated testing and deployment pipelines for your repositories.
  # Note: You need to configure WOODPECKER_GITEA_URL, WOODPECKER_GITEA_CLIENT, and WOODPECKER_GITEA_SECRET
  # or use GitHub/GitLab integration by setting the appropriate environment variables.
  woodpecker-server:
    container_name: hl-woodpecker-server
    image: woodpeckerci/woodpecker-server:${WOODPECKER_SERVER_IMAGE_TAG:-v3.19.0}
    environment:
      - WOODPECKER_OPEN=false
      - WOODPECKER_HOST=https://${WOODPECKER_DOMAIN}
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
      # SQLite in WAL mode with a busy timeout. The default (rollback journal, no timeout) fails
      # writes with "database is locked" when several pipelines run, and the agent then loses or
      # re-runs workflows. The "no sqlite3 file found" warning at start is harmless.
      - WOODPECKER_DATABASE_DATASOURCE=file:/var/lib/woodpecker/woodpecker.sqlite?_busy_timeout=30000&_journal_mode=WAL&_txlock=immediate
      # Build logs go to one file per step in logs/, not into the database, which they grew by
      # gigabytes. woodpecker-db moves the logs an older install kept in the database.
      - WOODPECKER_LOG_STORE=file
      - WOODPECKER_LOG_STORE_FILE_PATH=/var/lib/woodpecker/logs
      # GitHub integration (comment out if using Gitea/GitLab)
      - WOODPECKER_GITHUB=true
      - WOODPECKER_GITHUB_CLIENT=${WOODPECKER_GITHUB_CLIENT}
      - WOODPECKER_GITHUB_SECRET=${WOODPECKER_GITHUB_SECRET}
      # Uncomment for Gitea integration
      # - WOODPECKER_GITEA=true
      # - WOODPECKER_GITEA_URL=${WOODPECKER_GITEA_URL}
      # - WOODPECKER_GITEA_CLIENT=${WOODPECKER_GITEA_CLIENT}
      # - WOODPECKER_GITEA_SECRET=${WOODPECKER_GITEA_SECRET}
      # Uncomment for GitLab integration
      # - WOODPECKER_GITLAB=true
      # - WOODPECKER_GITLAB_URL=${WOODPECKER_GITLAB_URL}
      # - WOODPECKER_GITLAB_CLIENT=${WOODPECKER_GITLAB_CLIENT}
      # - WOODPECKER_GITLAB_SECRET=${WOODPECKER_GITLAB_SECRET}
      - WOODPECKER_ADMIN=${WOODPECKER_ADMIN}
    volumes:
      - ${VOLUMES_PATH}/woodpecker-server:/var/lib/woodpecker:z
    depends_on:
      woodpecker-db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.hl-woodpecker.loadbalancer.server.port=8000"
      - "traefik.http.routers.hl-woodpecker.rule=Host(`${WOODPECKER_DOMAIN}`)"
      - "traefik.http.routers.hl-woodpecker.middlewares=frame-deny@file,robots-deny@file"
      - "traefik.http.routers.hl-woodpecker.entrypoints=websecure"
      - "traefik.http.routers.hl-woodpecker.tls=true"
      - "traefik.http.routers.hl-woodpecker.tls.certresolver=myresolver"

  # Looks after the server's database (stacks/woodpecker/db-helper.ts): restores it from the
  # backup copy when it is missing, moves build logs out of it before the server starts, then
  # writes a consistent copy to backup/ every 15 minutes, which the nightly backup saves without
  # stopping the server. `-A` is needed: Deno's SQLite allows the ATTACH that VACUUM uses only to
  # a process with every permission. The container is the boundary: no network, and only the
  # server's data folder and the script are mounted.
  woodpecker-db:
    container_name: hl-woodpecker-db
    image: denoland/deno:${WOODPECKER_DB_IMAGE_TAG:-2.9.0}
    # The server image's own user, so the files it reads and writes stay its own.
    user: "1000:1000"
    command: ["run", "-A", "/db-helper.ts"]
    environment:
      - DENO_DIR=/tmp/deno-dir
      - SQLITE_TMPDIR=/var/lib/woodpecker
    volumes:
      - ${VOLUMES_PATH}/woodpecker-server:/var/lib/woodpecker:z
      - ${PATH_APPS}/stacks/woodpecker/db-helper.ts:/db-helper.ts:ro,z
    network_mode: none
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/woodpecker-db-ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      # The first start after an upgrade moves every stored log: about 6 minutes per 4 GB.
      start_period: 2h
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
    security_opt:
      - no-new-privileges:true

  woodpecker-agent:
    container_name: hl-woodpecker-agent
    image: woodpeckerci/woodpecker-agent:${WOODPECKER_AGENT_IMAGE_TAG:-v3.19.0}
    user: "${PUID:-1000}:${PGID:-1000}"
    group_add:
      - "${DOCKER_GROUP_ID:-990}" # Allow access to docker.sock
    environment:
      - WOODPECKER_SERVER=woodpecker-server:9000
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
      - WOODPECKER_BACKEND=docker
      # Workflows the agent runs at once. Each one runs as its own containers beside the agent,
      # outside the agent's limits below, so size it to the host's free memory and cores.
      - WOODPECKER_MAX_WORKFLOWS=${WOODPECKER_MAX_WORKFLOWS:-4}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${VOLUMES_PATH}/woodpecker-agent/cache:/woodpecker/cache # Cache for faster builds
    depends_on:
      - woodpecker-server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8192M # Increased for Deno+Vite+Hono monorepos
          cpus: "4" # More CPU for parallel builds
    security_opt:
      - no-new-privileges:true
      - label=type:container_runtime_t # Required for SELinux to access docker.sock
