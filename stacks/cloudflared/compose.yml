name: ${PROJECT}

networks:
  proxy:
    external: true

services:
  # Cloudflared creates a secure tunnel to Cloudflare's network.
  # This allows you to expose services without a static IP or opening ports.
  # Works with Traefik to route traffic through Cloudflare Tunnel.
  cloudflared:
    container_name: hl-cloudflared
    image: cloudflare/cloudflared:${CLOUDFLARED_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: tunnel run
    # cloudflared has a hard-coded Sentry DSN and no switch to turn crash reports off.
    extra_hosts:
      - "sentry.io:0.0.0.0"
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TUNNEL_TOKEN}
    networks:
      - proxy
    deploy:
      resources:
        limits:
          cpus: ${CLOUDFLARED_CPU_LIMIT:-0.5}
          memory: ${CLOUDFLARED_MEM_LIMIT:-256M}
    security_opt:
      - no-new-privileges:true
