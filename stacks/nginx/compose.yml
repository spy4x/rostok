networks:
  proxy:
    external: true
  default:
    external: true
    name: proxy

services:
  # A simple HTML page to display links to all the services.
  # Can be used for dashboards, landing pages, etc.
  # Serves ${PATH_APPS}/configs/nginx/src, i.e. servers/<server>/configs/nginx/src in the project.
  # NGINX_DOMAIN is the public host name, NGINX_CONTAINER_NAME the container and Traefik router name.
  #
  nginx:
    container_name: ${NGINX_CONTAINER_NAME}
    image: nginx:${NGINX_IMAGE_TAG:-alpine}
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ${PATH_APPS}/configs/nginx/src:/usr/share/nginx/html:ro,z
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.10"
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.${NGINX_CONTAINER_NAME}.loadbalancer.server.port=80"
      - "traefik.http.routers.${NGINX_CONTAINER_NAME}.rule=Host(`${NGINX_DOMAIN:-${NGINX_CONTAINER_NAME}.${DOMAIN}}`)"
      - "traefik.http.routers.${NGINX_CONTAINER_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${NGINX_CONTAINER_NAME}.tls=true"
      - "traefik.http.routers.${NGINX_CONTAINER_NAME}.tls.certresolver=myresolver"
      # nginx-served sites are public-facing by default. Override the global
      # X-Robots-Tag deny from security-headers so SEO crawlers can index.
      - "traefik.http.routers.${NGINX_CONTAINER_NAME}.middlewares=allow-index@file"
