name: ${PROJECT}

networks:
  proxy:
    external: true
  default:
    external: true
    name: proxy

services:
  mirotalk:
    container_name: hl-mirotalk
    image: mirotalk/p2p:${MIROTALK_IMAGE_TAG:-latest}
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - TZ=${TIMEZONE:-UTC}
      # Required: the image exits at start without a JWT key of at least 32 characters.
      - JWT_KEY=${MIROTALK_JWT_KEY:?}
      # Required: without it the image uses a default API key that its documentation prints.
      - API_KEY_SECRET=${MIROTALK_API_KEY_SECRET:?}
      - TURN_SERVER_ENABLED=true
      - TURN_SERVER_URL=turns:${MIROTALK_DOMAIN:-talk.${DOMAIN}}:5349
      - TURN_SERVER_USERNAME=${MIROTALK_TURN_SERVER_USERNAME:?}
      - TURN_SERVER_CREDENTIAL=${MIROTALK_TURN_SERVER_CREDENTIAL:?}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.hl-mirotalk.loadbalancer.server.port=3000"
      - "traefik.http.routers.hl-mirotalk.rule=Host(`${MIROTALK_DOMAIN:-talk.${DOMAIN}}`)"
      - "traefik.http.routers.hl-mirotalk.middlewares=frame-deny@file,robots-deny@file"
      - "traefik.http.routers.hl-mirotalk.entrypoints=websecure"
      - "traefik.http.routers.hl-mirotalk.tls=true"
      - "traefik.http.routers.hl-mirotalk.tls.certresolver=myresolver"

  # coturn — TURN relay for MiroTalk WebRTC ICE.
  # network_mode: host is REQUIRED: Traefik cannot proxy UDP TURN traffic.
  # All config via command-line args so docker-compose env interpolation works.
  # Public inbound ports on the host:
  #   3478/udp        — STUN/TURN (UDP)
  #   5349/tcp        — TURN over TLS (fallback for networks blocking UDP)
  #   10000-20000/udp — TURN relay port range
  # Browsers advertise turns://...:5349 first; MiroTalk config (single URL)
  # limits us to one TURN endpoint per the upstream app.
  mirotalk-coturn:
    container_name: hl-mirotalk-coturn
    image: coturn/coturn:${MIROTALK_COTURN_IMAGE_TAG:-latest}
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=10000
      - --max-port=20000
      - --realm=${MIROTALK_DOMAIN:-talk.${DOMAIN}}
      - --server-name=${MIROTALK_DOMAIN:-talk.${DOMAIN}}
      - --external-ip=${MIROTALK_PUBLIC_IP}/${MIROTALK_PUBLIC_IP}
      - --relay-ip=${MIROTALK_PUBLIC_IP}
      - --fingerprint
      - --lt-cred-mech
      - --user=${MIROTALK_TURN_SERVER_USERNAME:?}:${MIROTALK_TURN_SERVER_CREDENTIAL:?}
      # Every joiner of a room gets the TURN login, so the relay must not forward to addresses
      # only this host can reach. coturn 4.18 already refuses loopback, 0.0.0.0, link-local and
      # IPv6 unique-local peers; the private IPv4 ranges, carrier-grade NAT, the two reserved
      # blocks 192.0.0.0/24 and 198.18.0.0/15, and multicast it relays to unless told otherwise. All are listed, so an older or newer image refuses
      # them too. Never add the server's public address: two browsers that both use the relay
      # reach each other through it. Never add `::` or a range that starts at it either: coturn
      # 4.18 then refuses every peer, public ones too (it refuses `::` itself without a range).
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.0.0.0-192.0.0.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=198.18.0.0-198.19.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --total-quota=500
      - --stale-nonce=600
      - --cert=/certs/${MIROTALK_DOMAIN:-talk.${DOMAIN}}.crt
      - --pkey=/certs/${MIROTALK_DOMAIN:-talk.${DOMAIN}}.key
    volumes:
      - coturn-certs:/certs:ro
    restart: unless-stopped
    depends_on:
      mirotalk-cert-extract:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.3"
    security_opt:
      - no-new-privileges:true

  # Sidecar: extract the MIROTALK_DOMAIN cert from Traefik's acme.json and write
  # PEM files to the coturn-certs volume. Polls every 5 min so LE renewals
  # propagate to coturn automatically.
  mirotalk-cert-extract:
    container_name: hl-mirotalk-cert-extract
    image: python:${MIROTALK_CERT_EXTRACT_IMAGE_TAG:-3-alpine}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
          exec python3 /script/cert-extract.py
    working_dir: /script
    volumes:
      - ./cert-extract.py:/script/cert-extract.py:ro,z
      - ${VOLUMES_PATH}/traefik/letsencrypt/acme.json:/acme.json:ro,z
      - coturn-certs:/certs
    environment:
      - ACME_PATH=/acme.json
      - CERTS_DIR=/certs
      - MIROTALK_DOMAIN=${MIROTALK_DOMAIN:-talk.${DOMAIN}}
      - POLL_INTERVAL=300
      - TZ=${TIMEZONE:-UTC}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"
    security_opt:
      - no-new-privileges:true

volumes:
  coturn-certs:
    name: ${PROJECT}-mirotalk-coturn-certs
