name: ${PROJECT}

networks:
  proxy:
    external: true
  default:
    external: true
    name: proxy

services:
  mirotalk:
    container_name: hl-mirotalk
    image: mirotalk/p2p:latest
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - TZ=${TIMEZONE:-UTC}
      - TURN_SERVER_ENABLED=true
      - TURN_SERVER_URL=turns:${DOMAIN}:5349
      - TURN_SERVER_USERNAME=${TURN_SERVER_USERNAME}
      - TURN_SERVER_CREDENTIAL=${TURN_SERVER_CREDENTIAL}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.hl-mirotalk.loadbalancer.server.port=3000"
      - "traefik.http.routers.hl-mirotalk.rule=Host(`talk.${DOMAIN}`)"
      - "traefik.http.routers.hl-mirotalk.middlewares=robots-deny@file"
      - "traefik.http.routers.hl-mirotalk.entrypoints=websecure"
      - "traefik.http.routers.hl-mirotalk.tls=true"
      - "traefik.http.routers.hl-mirotalk.tls.certresolver=myresolver"

  # coturn — TURN relay for MiroTalk WebRTC ICE.
  # network_mode: host is REQUIRED: Traefik cannot proxy UDP TURN traffic.
  # All config via command-line args so docker-compose env interpolation works.
  # Public inbound ports on the host:
  #   3478/udp        — STUN/TURN (UDP)
  #   5349/tcp        — TURN over TLS (fallback for networks blocking UDP)
  #   10000-20000/udp — TURN relay port range
  # Browsers advertise turns://...:5349 first; MiroTalk config (single URL)
  # limits us to one TURN endpoint per the upstream app.
  mirotalk-coturn:
    container_name: hl-mirotalk-coturn
    image: coturn/coturn:latest
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=10000
      - --max-port=20000
      - --realm=${DOMAIN}
      - --server-name=${DOMAIN}
      - --external-ip=${PUBLIC_IP}/${PUBLIC_IP}
      - --relay-ip=${PUBLIC_IP}
      - --fingerprint
      - --lt-cred-mech
      - --user=${TURN_SERVER_USERNAME}:${TURN_SERVER_CREDENTIAL}
      - --total-quota=500
      - --stale-nonce=600
      - --cert=/certs/talk.${DOMAIN}.crt
      - --pkey=/certs/talk.${DOMAIN}.key
    volumes:
      - coturn-certs:/certs:ro
    restart: unless-stopped
    depends_on:
      mirotalk-cert-extract:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.3"
    security_opt:
      - no-new-privileges:true

  # Sidecar: extract ${talk.DOMAIN} cert from Traefik's acme.json and write
  # PEM files to the coturn-certs volume. Polls every 5 min so LE renewals
  # propagate to coturn automatically.
  mirotalk-cert-extract:
    container_name: hl-mirotalk-cert-extract
    image: python:3-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
          exec python3 /script/cert-extract.py
    working_dir: /script
    volumes:
      - ./cert-extract.py:/script/cert-extract.py:ro,z
      - ${VOLUMES_PATH}/traefik/letsencrypt/acme.json:/acme.json:ro,z
      - coturn-certs:/certs
    environment:
      - ACME_PATH=/acme.json
      - CERTS_DIR=/certs
      - DOMAIN=${DOMAIN}
      - POLL_INTERVAL=300
      - TZ=${TIMEZONE:-UTC}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"
    security_opt:
      - no-new-privileges:true

volumes:
  coturn-certs:
    name: ${PROJECT}-mirotalk-coturn-certs
