name: ${PROJECT}

networks:
  proxy:
    external: true

services:
  # mig — Tiny self-hosted meeting scheduler (миг = moment).
  # One owner, one URL, one feature: book a time slot.
  mig:
    container_name: hl-mig
    # Published by mig's own CI (github.com/spy4x/mig) to Docker Hub on
    # every v* tag: a stable tag like v1.2.3 also moves `latest`, a
    # pre-release tag like v1.2.3-rc.1 never does. Deploying this stack
    # (`deno task deploy <server> mig`) always pulls the tag below first
    # (pull_policy: always — `docker compose up -d --build` on its own
    # only pulls an image that's missing locally, and `--build` is a
    # no-op here since this service has no `build:`) and recreates the
    # container if the digest changed. Watchtower (this repo's
    # `watchtower` stack) also polls every
    # container daily on its own, so a stable release mig's CI publishes
    # goes live within a day with no human step either way.
    # Pin or roll back to a specific release by setting in the server's
    # `.env`, then `deno task env:encrypt` and deploy:
    #   MIG_IMAGE_TAG=v0.3.0
    image: antonshubin/mig:${MIG_IMAGE_TAG:-latest}
    pull_policy: always
    # The image runs as a non-root user baked into it (uid 1993, `deno`,
    # from mig's v0.4.0). The deploy script (cli/deploy/volumes.ts)
    # chowns ${VOLUMES_PATH}/mig to PUID:PGID (default 1000:1000, see
    # cli/deploy/env.ts) on every deploy, not to the image's built-in
    # uid, so a freshly provisioned server's data dir is unwritable by
    # the container's default user. Running the container as the same
    # PUID:PGID the deploy script already chowns the volume to sidesteps
    # that mismatch — the same fix stacks/gatus, stacks/filebrowser,
    # stacks/ntfy, stacks/traefik, stacks/vaultwarden,
    # stacks/watchtower and stacks/woodpecker already use for the same
    # reason.
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    env_file:
      - ${PATH_APPS}/configs/mig.env
    volumes:
      - ${VOLUMES_PATH}/mig:/data:z
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          # 128M was too tight: deno's V8 heap + Fresh render state
          # thrashes cgroup memory and slows the first request after
          # boot by ~3s (3-15x slower). 256M keeps it consistently
          # fast without going overboard for a 1-page SSR app.
          memory: 256M
          # cpus: 0.2 was too tight on a busy host — deno's SSR
          # render takes ~3-4s under that share. 0.5 brought it
          # to ~700ms. 1.0 keeps it under 300ms with headroom for
          # the booking form POST + email send path.
          cpus: "1"
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.hl-mig.loadbalancer.server.port=8080"
      - "traefik.http.routers.hl-mig.rule=Host(`meet.${DOMAIN}`)"
      - "traefik.http.routers.hl-mig.entrypoints=websecure"
      - "traefik.http.routers.hl-mig.tls=true"
      - "traefik.http.routers.hl-mig.tls.certresolver=myresolver"
      # Two routers share this one service, so each names it explicitly
      # rather than relying on Traefik's single-service auto-match.
      - "traefik.http.routers.hl-mig.service=hl-mig"
      # robots-deny — booking page isn't index-worthy.
      # MIG_MIDDLEWARES replaces the whole chain for every path outside
      # /embed. With the default, no site can show mig in an iframe:
      # security-headers sends X-Frame-Options: DENY, here and again on
      # the websecure entrypoint. To embed the scheduler in your own
      # site, set MIG_EMBED_MIDDLEWARES on the hl-mig-embed router below
      # instead — see README.md § "Embedding in your own site". Deploy
      # traefik before mig: a router naming a middleware that does not
      # exist yet answers 404.
      - "traefik.http.routers.hl-mig.middlewares=${MIG_MIDDLEWARES:-security-headers@file,compression@file,robots-deny@file}"
      # hl-mig-embed — same host, /embed only. Every step of the embed
      # flow (mig#14) stays under /embed: /embed, /embed?date=…,
      # /embed?date=…&slot=…, the booking POST to /embed/book,
      # /embed/confirmed. Scoping the frame-ancestors policy to this
      # router means the rest of the host (/, /confirmed, /health) keeps
      # refusing to be framed. Traefik already prefers the longer rule on
      # its own, but priority=1000 pins the order explicitly — well above
      # any rule-length default — so it stays correct if either rule's
      # length changes later.
      # PathPrefix is a plain string prefix, so /embedded would match too;
      # mig serves nothing there, so only a 404 page would carry the header.
      - "traefik.http.routers.hl-mig-embed.rule=Host(`meet.${DOMAIN}`) && PathPrefix(`/embed`)"
      - "traefik.http.routers.hl-mig-embed.priority=1000"
      - "traefik.http.routers.hl-mig-embed.entrypoints=websecure"
      - "traefik.http.routers.hl-mig-embed.tls=true"
      - "traefik.http.routers.hl-mig-embed.tls.certresolver=myresolver"
      - "traefik.http.routers.hl-mig-embed.service=hl-mig"
      # MIG_EMBED_MIDDLEWARES falls back to whatever MIG_MIDDLEWARES
      # resolves to (a server's whole-host override included), so a
      # server that never set either variable sees no behavior change.
      - "traefik.http.routers.hl-mig-embed.middlewares=${MIG_EMBED_MIDDLEWARES:-${MIG_MIDDLEWARES:-security-headers@file,compression@file,robots-deny@file}}"
