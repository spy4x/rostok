name: ${PROJECT}

networks:
  proxy:
    external: true

# mig — Tiny self-hosted meeting scheduler (миг = moment).
# One owner, one URL, one feature: book a time slot.
#
# Architecture note: mig runs as a systemd service on the host (not in
# Docker) because the Fresh 2 + deno serve stack returns an empty HTML
# body when run inside containers (works fine on host). socat bridges
# Traefik's docker network to host:18080.
#
# See:
#   ~/.config/systemd/user/mig.service
#   /home/spy4x/mig-src/_fresh/  (built locally)

services:
  # TCP proxy: Traefik proxy network <-> host:18080 where mig listens.
  mig-tcp-proxy:
    container_name: hl-mig-tcp-proxy
    image: alpine/socat:1.8.1.3
    restart: unless-stopped
    command: ["tcp-listen:8080,fork,reuseaddr", "tcp:host.docker.internal:18080"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy
    deploy:
      resources:
        limits:
          memory: 16M
          cpus: "0.05"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.hl-mig.loadbalancer.server.port=8080"
      - "traefik.http.routers.hl-mig.rule=Host(`meet.${DOMAIN}`)"
      - "traefik.http.routers.hl-mig.entrypoints=websecure"
      - "traefik.http.routers.hl-mig.tls=true"
      - "traefik.http.routers.hl-mig.tls.certresolver=myresolver"
      - "traefik.http.routers.hl-mig.middlewares=security-headers@file,compression@file,robots-deny@file"
