networks:
  # Neither service is on the shared proxy network: both drive a browser with no authentication.
  # Only the two services and their client (Open WebUI, connected by after.deploy.ts) are on this
  # one (spy4x/rostok#338).
  mcp:
    name: hl-playwright-mcp

services:
  playwright:
    container_name: hl-playwright
    # Built from Dockerfile.server: the Playwright image plus the package of the same release, so a
    # start downloads nothing (spy4x/rostok#410).
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        PLAYWRIGHT_IMAGE_TAG: ${PLAYWRIGHT_IMAGE_TAG:-v1.60.0-noble}
    # Chromium runs headless without its sandbox here, so the container is the boundary: no root,
    # no capabilities, no privilege gain. Docker's seccomp filter stays on.
    user: pwuser
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # Healthy once the browser server accepts connections on its port.
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(3000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - mcp

  playwright-mcp:
    container_name: hl-playwright-mcp
    build:
      context: .
      dockerfile: Dockerfile.mcp-proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.5"
    networks:
      - mcp
