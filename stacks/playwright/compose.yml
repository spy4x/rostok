networks:
  proxy:
    external: true
  default:
    external: true
    name: proxy

services:
  playwright:
    container_name: hl-playwright
    image: mcr.microsoft.com/playwright:v1.58.0-noble
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    command: npx -y playwright@1.58.0 run-server --port 3000 --host 0.0.0.0
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - proxy

  playwright-mcp:
    container_name: hl-playwright-mcp
    build:
      context: .
      dockerfile: Dockerfile.mcp-proxy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.5"
    networks:
      - proxy
