networks:
  # Neither service is on the shared proxy network: both drive a browser with no authentication.
  # Only the two services and their client (Open WebUI, connected by after.deploy.ts) are on this
  # one (spy4x/rostok#338).
  mcp:
    name: hl-playwright-mcp

services:
  playwright:
    container_name: hl-playwright
    image: mcr.microsoft.com/playwright:${PLAYWRIGHT_IMAGE_TAG:-v1.60.0-noble}
    # Chromium runs headless without its sandbox here, so the container is the boundary: no root,
    # no capabilities, no privilege gain. Docker's seccomp filter stays on.
    user: pwuser
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    command: npx -y playwright@1.60.0 run-server --port 3000 --host 0.0.0.0
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - mcp

  playwright-mcp:
    container_name: hl-playwright-mcp
    build:
      context: .
      dockerfile: Dockerfile.mcp-proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.5"
    networks:
      - mcp
