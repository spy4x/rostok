name: ${PROJECT}
networks:
  proxy:
    external: true
  default:
    external: true
    name: proxy

services:
  # OfferLens — combined API+Web server (Hono, Preact SSR) on port 8000
  # Source: https://github.com/spy4x/offer-lens
  # Build: docker build -t hl-offerlens:latest ~/sync/code/offer-lens/
  offerlens:
    container_name: hl-offerlens
    image: hl-offerlens:latest
    environment:
      - PORT=8000
      - DEMO_OPENAI_API_KEY=${OFFERLENS_DEMO_API_KEY}
      - OPENAI_API_BASE=${OFFERLENS_API_BASE:-https://api.deepseek.com}
      - LLM_MODEL=${OFFERLENS_MODEL:-deepseek-chat}
      - BATCH_CONCURRENCY=${OFFERLENS_BATCH_CONCURRENCY:-5}
      - DB_HOST=offerlens-db
      - DB_PORT=5432
      - DB_NAME=${OFFERLENS_DB_NAME:-offerlens}
      - DB_USER=${OFFERLENS_DB_USER:-offerlens}
      - DB_PASS=${OFFERLENS_DB_PASSWORD}
    networks:
      - proxy
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.hl-offerlens.loadbalancer.server.port=8000"
      - "traefik.http.routers.hl-offerlens.rule=Host(`offer-lens.${DOMAIN}`)"
      - "traefik.http.routers.hl-offerlens.entrypoints=websecure"
      - "traefik.http.routers.hl-offerlens.tls=true"
      - "traefik.http.routers.hl-offerlens.tls.certresolver=myresolver"
      # No auth middleware — has own login
    depends_on:
      offerlens-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # OfferLens MCP — stdio/HTTP dual transport for Claude Desktop + OpenWebUI
  # No Traefik exposure — OpenWebUI reaches it via Docker DNS at hl-offerlens-mcp:3000
  offerlens-mcp:
    container_name: hl-offerlens-mcp
    image: hl-offerlens-mcp:latest
    environment:
      - OFFERLENS_BACKEND_URL=http://hl-offerlens:8000
      - OFFERLENS_API_KEY=${OFFERLENS_DEMO_API_KEY}
      - OFFERLENS_SESSION_ID=${OFFERLENS_MCP_SESSION_ID:-offerlens-mcp}
      - MCP_HTTP_PORT=3000
    networks:
      - proxy
      - default
    depends_on:
      - offerlens
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.2"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "deno eval 'const r = await fetch(\"http://localhost:3000/health\"); Deno.exit(r.ok ? 0 : 1)' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=false"

  # PostgreSQL database for OfferLens usage tracking
  offerlens-db:
    container_name: hl-offerlens-db
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${OFFERLENS_DB_NAME:-offerlens}
      - POSTGRES_USER=${OFFERLENS_DB_USER:-offerlens}
      - POSTGRES_PASSWORD=${OFFERLENS_DB_PASSWORD}
    volumes:
      - ${VOLUMES_PATH}/offerlens/db:/var/lib/postgresql/data:z
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OFFERLENS_DB_USER:-offerlens}"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.3"
    restart: unless-stopped
