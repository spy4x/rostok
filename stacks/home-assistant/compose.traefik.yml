# Traefik-routed variant — use together with compose.yml:
#   docker compose -f compose.yml -f compose.traefik.yml up -d
#
# Adds Traefik labels + proxy network for public HTTPS at home.${DOMAIN}.
# Requires a Traefik container running on the `proxy` network.

networks:
  proxy:
    external: true
  default:
    external: true
    name: proxy

services:
  home-assistant:
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.hl-home-assistant.loadbalancer.server.port=8123"
      - "traefik.http.routers.hl-home-assistant.rule=Host(`home.${DOMAIN}`)"
      - "traefik.http.routers.hl-home-assistant.entrypoints=websecure"
      - "traefik.http.routers.hl-home-assistant.tls=true"
      - "traefik.http.routers.hl-home-assistant.tls.certresolver=myresolver"
