# Home Assistant with HOST networking: mDNS/SSDP/DHCP discovery of IoT
# devices (Zigbee bulbs, smart plugs, sensors) does not work through a
# Docker bridge. Reachable on http://<lan-ip>:8123 from the whole LAN, so
# run it on a trusted home network only, never on a public-facing host.
#
# Public HTTPS instead: add compose.traefik.yml as an override
#   docker compose -f compose.yml -f compose.traefik.yml up -d
# (`rostok deploy` deploys compose.yml plus servers/<server>/compose-override/
# home-assistant.yml, so copy compose.traefik.yml there to use it.)
#
# Local data lives at ${VOLUMES_PATH}/home-assistant (gitignored).

services:
  home-assistant:
    container_name: hl-home-assistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      # Absolute path: docker compose v2 sets the project's working dir to
      # the first compose file's directory, so any relative path here would
      # resolve against that dir — not the user's cwd. Anchoring on the
      # canonical deploy data dir keeps the same compose file portable.
      - ${VOLUMES_PATH}/home-assistant:/config:z
      - /etc/localtime:/etc/localtime:ro
    network_mode: host
    devices:
      - ${HOME_ASSISTANT_ZIGBEE_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0 # Zigbee USB dongle
    environment:
      - TZ=${TIMEZONE}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${HOME_ASSISTANT_MEM_LIMIT:-2048M}
          cpus: ${HOME_ASSISTANT_CPU_LIMIT:-2}
    security_opt:
      - no-new-privileges:true
      # Pin SELinux MCS label to s0 (Fedora/RHEL only). Without this, docker
      # assigns a random category pair on every restart, leaving the /config
      # bind mount with stale labels the new container process can't read
      # (MLS constraint denial → setroubleshootd spam).
      - label=level:s0
