# Local-only Home Assistant on a mini PC / dev machine.
#
# Drop-in alternative to ../compose.yml — no Traefik, no proxy network, no
# Authelia. Reachable at http://localhost:8123. Intended for spinning up
# Home Assistant on a laptop / mini PC that has a Zigbee USB dongle
# physically attached, so you can pair and test Zigbee devices before
# migrating the stack to the production "home" server.
#
# Usage:
#   docker compose -f compose.local.yml up -d
#   open http://localhost:8123
#
# Storage:
#   Set HOME_ASSISTANT_DATA_PATH to an absolute path outside this repo.

services:
  home-assistant:
    container_name: hl-home-assistant-local
    image: ghcr.io/home-assistant/home-assistant:stable
    # host network is recommended for local-only HA — mDNS / SSDP / DHCP
    # discovery of IoT devices breaks inside bridge networks.
    #
    # Note: host networking means HA binds 0.0.0.0:8123, so it is reachable
    # from the whole LAN, not just localhost. That is fine on a trusted home
    # network — but do not run this on an untrusted one without a host
    # firewall rule, and never on a public-facing host.
    network_mode: host
    volumes:
      - ${HOME_ASSISTANT_DATA_PATH:?Set HOME_ASSISTANT_DATA_PATH in .env}:/config:z
      - /etc/localtime:/etc/localtime:ro,z
    devices:
      # Sonoff Zigbee 3.0 USB Dongle Plus V2 (TI CC2652P).
      # /dev/serial/by-id symlink survives reboots and USB re-enumeration,
      # unlike /dev/ttyUSB0 which can shift to ttyUSB1 when other serial
      # devices are plugged in (we have a CH340 on ttyUSB1 as well).
      # If your device path differs, run `ls -l /dev/serial/by-id/` and
      # update the path below.
      - ${ZIGBEE_DEVICE_PATH:?Set ZIGBEE_DEVICE_PATH in .env}:/dev/ttyUSB0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "2"
    security_opt:
      # Pin SELinux MCS label to s0. Without this, docker assigns a random
      # category pair on every container restart, leaving the /config bind
      # mount with stale labels that the new container process can't read
      # (MLS constraint denial → setroubleshootd spam). Fedora/RHEL only.
      - no-new-privileges:true
      - label=level:s0
    environment:
      - TZ=${TZ:-Europe/Berlin}
