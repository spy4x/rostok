name: ${PROJECT}

services:
  # Watchtower is a process for automating Docker container base image updates.
  watchtower:
    container_name: hl-watchtower
    image: nickfedor/watchtower:${WATCHTOWER_IMAGE_TAG:-latest}
    user: "${PUID:-1000}:${PGID:-1000}"
    group_add:
      - "${DOCKER_GROUP_ID:-990}" # Allow access to docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${WATCHTOWER_CPU_LIMIT:-0.5}
          memory: ${WATCHTOWER_MEM_LIMIT:-256M}
    security_opt:
      - no-new-privileges:true
      - label=type:container_runtime_t # Required for SELinux to access docker.sock
      # No MCS categories: with no-new-privileges, SELinux refuses every `docker exec` (a
      # healthcheck, a shell) that would switch into them, and logs an nnp_transition
      # denial each time.
      - label=level:s0
    # --include-restarting: a container crash-looping on a broken image would
    # otherwise never receive the upstream fix.
    command: --interval 86400 --cleanup --include-restarting
