# Syncthing — reusable compose, no server-specific paths.
# Per-server host paths come from servers/<server>/compose-override/syncthing.yml
# (committed), merged at deploy time. Folders + devices come from
# servers/<server>/configs/syncthing.yml and are reconciled via the REST API
# by stacks/syncthing/after.deploy.ts.
#
# Required env (in server .env):
#   SYNCTHING_API_KEY     — STGUIAPIKEY; same value persisted in
#                           /var/syncthing/config/config.xml
#   SYNCTHING_SUBDOMAIN   — Traefik host rule
#   DOMAIN                — base domain
#
# ── First deploy ────────────────────────────────────────────────────
# Generate the API key yourself before the first deploy. Do NOT leave the
# placeholder in .env: Syncthing uses STGUIAPIKEY verbatim, so the container
# would come up with an API key that is committed to this repo, on a GUI
# Traefik publishes. before.deploy.ts refuses to deploy in that case.
#
#   head -c 24 /dev/urandom | base64        # generate
#   # put it in servers/<server>/.env as SYNCTHING_API_KEY=...
#   deno task env:encrypt                   # then commit the .env.age
#   deno task deploy <server> syncthing
#
# STGUIAPIKEY overrides whatever is in config.xml on every start, so the key
# stays stable across restarts and re-creations.

name: ${PROJECT}

networks:
  proxy:
    external: true
  default:
    external: true
    name: proxy

services:
  syncthing:
    container_name: hl-syncthing
    image: syncthing/syncthing:latest
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8384/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Forces container to use a stable API key across restarts.
      # Syncthing overrides whatever is in config.xml.
      - STGUIAPIKEY=${SYNCTHING_API_KEY:?}
      - STHOMEDIR=/var/syncthing/config
    # Volumes are NOT defined here — bind mounts live in the committed
    # per-server override at:
    #   servers/<server>/compose-override/syncthing.yml
    # The deploy script (scripts/deploy/src/+lib.ts) merges it automatically.
    ports:
      - 22000:22000/tcp # BEP
      - 22000:22000/udp # QUIC
      - 21027:21027/udp # Discovery
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${SYNCTHING_CPU_LIMIT:-1}
          memory: ${SYNCTHING_MEM_LIMIT:-1024M}
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.hl-syncthing.loadbalancer.server.port=8384"
      - "traefik.http.routers.hl-syncthing.rule=Host(`${SYNCTHING_SUBDOMAIN}.${DOMAIN}`)"
      - "traefik.http.routers.hl-syncthing.middlewares=robots-deny@file"
      - "traefik.http.routers.hl-syncthing.entrypoints=websecure"
      - "traefik.http.routers.hl-syncthing.tls=true"
      - "traefik.http.routers.hl-syncthing.tls.certresolver=myresolver"
