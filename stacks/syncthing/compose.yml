# Syncthing — reusable compose, no server-specific paths.
# Per-server host paths come from servers/<server>/compose-override/syncthing.yml
# (committed), merged at deploy time. Folders + devices come from
# servers/<server>/configs/syncthing.yml and are reconciled via the REST API
# by stacks/syncthing/after.deploy.ts.
#
# Required env (in server .env):
#   SYNCTHING_API_KEY     — STGUIAPIKEY, the API key the deploy hooks use
#   SYNCTHING_DOMAIN      — full host for the Traefik rule (e.g. sync.${DOMAIN})
#   SYNCTHING_GUI_USER, SYNCTHING_GUI_PASSWORD — the GUI login, set at start
#     when the config has no GUI password yet (see `entrypoint` below)
#
# ── First deploy ────────────────────────────────────────────────────
# `rostok stack add syncthing` generates SYNCTHING_API_KEY and writes it to
# the server's .env. Syncthing uses STGUIAPIKEY verbatim, so a placeholder
# would be a publicly known key on a GUI Traefik publishes;
# before.deploy.ts refuses to deploy with a missing, placeholder or short
# key. To set one by hand instead:
#   head -c 24 /dev/urandom | base64
#   # put it in servers/<server>/.env as SYNCTHING_API_KEY=..., then
#   rostok env encrypt                      # and commit the .env.age
#
# STGUIAPIKEY is accepted next to the key stored in config.xml, which is left
# unchanged (both answer the API), so the hooks' key is stable across restarts
# and re-creations. Change the stored key in the GUI to retire an old one.

name: ${PROJECT}

networks:
  proxy:
    external: true
  default:
    external: true
    name: proxy

services:
  syncthing:
    container_name: hl-syncthing
    image: syncthing/syncthing:${SYNCTHING_IMAGE_TAG:-latest}
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8384/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Traefik publishes the GUI, and Syncthing serves it with no login until a
    # password is set. So before Syncthing starts, a config without a GUI
    # password gets the login from the two variables: a first start never
    # serves an open GUI, and an older deployment that never set a password
    # gets one at its next start. A config that already has a password, set in
    # the GUI by hand, is left as it is. `generate` changes the login only and
    # keeps the keys, device id, folders and devices. Then the image's own
    # entrypoint runs unchanged.
    entrypoint:
      - /bin/sh
      - -c
      - |
          set -eu
          if grep -q '<password>..*</password>' /var/syncthing/config/config.xml 2>/dev/null; then
            echo "[rostok] The GUI already has a password. It is kept; SYNCTHING_GUI_USER and SYNCTHING_GUI_PASSWORD are not applied."
          else
            printf '%s' "$$SYNCTHING_GUI_PASSWORD" |
              /bin/entrypoint.sh /bin/syncthing generate --gui-user="$$SYNCTHING_GUI_USER" --gui-password=-
            echo "[rostok] The GUI had no password. Set its login from SYNCTHING_GUI_USER and SYNCTHING_GUI_PASSWORD."
          fi
          exec /bin/entrypoint.sh /bin/syncthing
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Forces container to use a stable API key across restarts.
      # Syncthing overrides whatever is in config.xml.
      - STGUIAPIKEY=${SYNCTHING_API_KEY:?}
      - STHOMEDIR=/var/syncthing/config
      - SYNCTHING_GUI_USER=${SYNCTHING_GUI_USER:?}
      - SYNCTHING_GUI_PASSWORD=${SYNCTHING_GUI_PASSWORD:?}
    # Volumes are NOT defined here — bind mounts live in the committed
    # per-server override at:
    #   servers/<server>/compose-override/syncthing.yml
    # The deploy script (scripts/deploy/src/+lib.ts) merges it automatically.
    ports:
      - 22000:22000/tcp # BEP
      - 22000:22000/udp # QUIC
      - 21027:21027/udp # Discovery
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${SYNCTHING_CPU_LIMIT:-1}
          memory: ${SYNCTHING_MEM_LIMIT:-1024M}
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.hl-syncthing.loadbalancer.server.port=8384"
      - "traefik.http.routers.hl-syncthing.rule=Host(`${SYNCTHING_DOMAIN}`)"
      - "traefik.http.routers.hl-syncthing.middlewares=frame-deny@file,robots-deny@file"
      - "traefik.http.routers.hl-syncthing.entrypoints=websecure"
      - "traefik.http.routers.hl-syncthing.tls=true"
      - "traefik.http.routers.hl-syncthing.tls.certresolver=myresolver"
