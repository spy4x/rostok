http:
  middlewares:
    # dashboard-auth — basic auth for Traefik dashboard.
    # Works on all servers (unlike authelia which only runs on home).
    dashboard-auth:
      basicAuth:
        usersFile: /etc/traefik/dynamic/.htpasswd
    compression:
      compress:
        excludedContentTypes:
          - text/event-stream
    # security-headers runs on every websecure router (the entrypoint middleware in compose.yml).
    # It runs after a router's own middlewares and after the app, and each header it names
    # replaces the value they set, so it names only headers that no service needs to change.
    security-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        # No referrerPolicy (spy4x/rostok#356): Traefik would replace the stricter `no-referrer`
        # that an app sets on its own pages (caldav-mcp's consent page and redirect). Browsers
        # already default to strict-origin-when-cross-origin, the value this used to set.
        stsSeconds: 15552000
        stsIncludeSubdomains: true
        stsPreload: true
        permissionsPolicy: >-
          camera=(self), microphone=(self), clipboard-read=(self), clipboard-write=(self),
          geolocation=(), payment=(), usb=(),
          interest-cohort=(), browsing-topics=(), accelerometer=(),
          gyroscope=(), magnetometer=()
        customResponseHeaders:
          # Decided in spy4x/rostok#354:
          # - No Access-Control-Allow-Origin. `*` here let any site read any service's responses
          #   from a browser, and it replaced the narrower origin a service sets itself
          #   (the stalwart stack on its JMAP router). A service that needs CORS sets it in the app
          #   or on its own router, like immich-kiosk (stacks/immich), the reason `*` was added (spy4x/rostok#123).
          # - Cross-Origin-Opener-Policy same-origin, as the cloud server already served it. It
          #   affects only windows that open each other, never images or iframes.
          # - No Cross-Origin-Resource-Policy. same-site blocks a page on another site, such as
          #   Home Assistant on a LAN address, from showing kiosk photos (spy4x/rostok#123), and this
          #   middleware runs last, so no router could relax it.
          Cross-Origin-Opener-Policy: same-origin
          # Cross-Origin-Embedder-Policy is NOT in security-headers —
          # it breaks cross-origin JMAP (Bulwark → Stalwart on different
          # subdomains). Add to individual router middlewares if needed.
          # X-Robots-Tag is intentionally NOT in security-headers. It lives in
          # its own middleware (robots-deny) so a public site can opt out by
          # not including it in its router labels.
          # All private self-hosted services SHOULD add robots-deny@file to
          # their Traefik router middlewares. See docs/blocking-crawlers.md.
    # robots-deny: opt-in X-Robots-Tag noindex/nofollow for self-hosted services.
    # Add to a router's middlewares chain to block indexing:
    #   traefik.http.routers.X.middlewares=...,robots-deny@file
    # A public site that search engines should index does NOT add this.
    robots-deny:
      headers:
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow, noarchive, nosnippet"
    # allow-index: says "index me" out loud, for a public site (the nginx and oko stacks use it).
    allow-index:
      headers:
        customResponseHeaders:
          X-Robots-Tag: "all"
    # No CORS rule for a webmail here: the stalwart stack defines its own on its router
    # (hl-stalwart-jmap, origin from STALWART_WEBMAIL_ORIGIN). A header rule that names one
    # installation's host belongs in that server's configs/traefik/dynamic/, not in this file.

  # A server adds its own routers, services and middlewares in
  # servers/<server>/configs/traefik/dynamic/*.yml: before.deploy.ts copies them next to this
  # file on every deploy (see README.md, "Per-server dynamic config").
