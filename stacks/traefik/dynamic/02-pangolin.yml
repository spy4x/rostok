tcp:
  routers:
    # Pass Pangolin hosts through to gerbil Traefik (which handles SSL + auth).
    # main hl-traefik owns host:80/443 and routes most services via HTTP labels.
    # For Pangolin hosts we use TCP+SNI passthrough so gerbil can do its
    # own SSL termination (LE certs for tunnel-cloud.antonshubin.com,
    # code2.antonshubin.com live in /letsencrypt on the gerbil Traefik).
    #
    # LE uses TLS-ALPN-01 (see stacks/pangolin/traefik/traefik_config.yml)
    # so the challenge rides on port 443 with SNI, no port 80 plumbing needed.
    # Port 80 falls through to the global HTTP→HTTPS redirect, which is fine
    # because nothing should be hitting Pangolin on plain HTTP.
    pangolin-tunnel-cloud-tls:
      rule: "HostSNI(`tunnel-cloud.antonshubin.com`)"
      entryPoints:
        - websecure
      service: pangolin-gerbil-tls
      tls:
        passthrough: true
    pangolin-code2-tls:
      rule: "HostSNI(`code2.antonshubin.com`)"
      entryPoints:
        - websecure
      service: pangolin-gerbil-tls
      tls:
        passthrough: true
  services:
    pangolin-gerbil-tls:
      loadBalancer:
        servers:
          - address: "hl-gerbil:443"
