# TCP+SNI passthrough so gerbil Traefik (in gerbil's netns) does Pangolin's SSL.
# main hl-traefik owns host:80/443. Gerbil Traefik does LE for tunnel-cloud/code2.
# LE uses TLS-ALPN-01 (challenges ride on port 443 SNI, no port 80 plumbing needed).
tcp:
  routers:
    pangolin-tunnel-cloud:
      rule: "HostSNI(`tunnel-cloud.antonshubin.com`)"
      entryPoints:
        - websecure
      service: pangolin-gerbil
      tls:
        passthrough: true
    pangolin-code2:
      rule: "HostSNI(`code2.antonshubin.com`)"
      entryPoints:
        - websecure
      service: pangolin-gerbil
      tls:
        passthrough: true
  services:
    pangolin-gerbil:
      loadBalancer:
        servers:
          - address: "hl-gerbil:443"
