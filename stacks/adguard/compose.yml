networks:
  proxy:
    external: true
  default:
    external: true
    name: proxy

services:
  # AdGuard Home is a network-wide ad and tracker blocker that also functions as a DNS server.
  # It provides DNS-level ad blocking, tracker blocking, and parental control features.
  # Access the web interface to configure DNS settings, filters, and view statistics.
  adguard:
    container_name: hl-adguard
    image: adguard/adguardhome:${ADGUARD_IMAGE_TAG:-latest}
    # Before the first setup (no AdGuardHome.yaml yet) the setup wizard listens on the container's
    # own loopback only, so no other container on proxy can finish it first and take over the DNS
    # server (spy4x/rostok#427). The README sets it up through `docker exec`. Once the config
    # exists, AdGuard listens where it says. The arguments are the image's own CMD.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
          if [ -f /opt/adguardhome/conf/AdGuardHome.yaml ];
          then exec /opt/adguardhome/AdGuardHome --no-check-update
          -c /opt/adguardhome/conf/AdGuardHome.yaml -w /opt/adguardhome/work;
          else exec /opt/adguardhome/AdGuardHome --no-check-update
          -c /opt/adguardhome/conf/AdGuardHome.yaml -w /opt/adguardhome/work
          --web-addr 127.0.0.1:3000;
          fi
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ${VOLUMES_PATH}/adguard/work:/opt/adguardhome/work:z
      - ${VOLUMES_PATH}/adguard/conf:/opt/adguardhome/conf:z
    ports:
      # DNS is published on ADGUARD_DNS_BIND only. The default, 127.0.0.1, answers this server and
      # nobody else, so a fresh deploy is never an open resolver. See the README before changing it.
      - ${ADGUARD_DNS_BIND:-127.0.0.1}:53:53/tcp # DNS
      - ${ADGUARD_DNS_BIND:-127.0.0.1}:53:53/udp # DNS
      - ${ADGUARD_DNS_BIND:-127.0.0.1}:853:853/tcp # DNS-over-TLS
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "3"
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.services.hl-adguard.loadbalancer.server.port=80"
      - "traefik.http.routers.hl-adguard.rule=Host(`${ADGUARD_DOMAIN:-dns.${DOMAIN}}`)"
      - "traefik.http.routers.hl-adguard.middlewares=frame-deny@file,robots-deny@file"
      - "traefik.http.routers.hl-adguard.entrypoints=websecure"
      - "traefik.http.routers.hl-adguard.tls=true"
      - "traefik.http.routers.hl-adguard.tls.certresolver=myresolver"
