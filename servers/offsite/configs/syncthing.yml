# Syncthing — server-specific config for offsite (Hetzner storage box).
#
# Single source of truth for: data dir, mount roots, folder↔device sharing,
# per-folder / per-device settings (paused, versioning, addresses, ...).
#
# The compose override (servers/offsite/compose-override/syncthing.yml) is
# committed separately and merges bind mounts into the generic compose.
# On every deploy, after.deploy.ts reconciles the running Syncthing with
# this file via the REST API.
#
# Device resolution: folders reference devices by name. Names are resolved
# to full device IDs via the top-level `devices:` list. Each syncthing
# instance stores its own names for remote devices — this file uses the
# names that THIS instance (offsite) shows.
#
# IMPORTANT: folders here use `type: receiveencrypted` — this is a
# backup-grade replica. Offsite only receives encrypted blobs from other
# devices and never decrypts them. Don't change to `sendreceive` without
# re-encrypting every folder from scratch.
#
# Deletion policy: removing a folder or device from this file does NOT
# remove it from the running Syncthing instance.
#
# Path expansion: only `~/` is expanded.

data_dir: ~/storage/apps/.volumes/syncthing

mounts:
  - host: ~/storage/sync
    container: /sync

folders:
  - id: archive
    path: /sync/archive
    type: receiveencrypted
    devices: [spy4x-offsite, spy4x-phone, spy4x-mini-pc, spy4x-laptop, spy4x-home]

  - id: backups
    path: /sync/backups
    type: receiveencrypted
    devices: [spy4x-offsite, spy4x-mini-pc, spy4x-home]

  - id: cloud-light-backups
    path: /sync/cloud-light-backups
    type: receiveencrypted
    devices: [spy4x-offsite, spy4x-phone, spy4x-cloudlab, spy4x-mini-pc, spy4x-laptop, spy4x-home]

  - id: essentials
    path: /sync/essentials
    type: receiveencrypted
    devices: [spy4x-offsite, spy4x-phone, spy4x-mini-pc, spy4x-laptop, spy4x-home]

  - id: random
    path: /sync/random
    type: receiveencrypted
    devices: [spy4x-offsite, spy4x-phone, spy4x-mini-pc, spy4x-laptop, spy4x-home]

devices:
