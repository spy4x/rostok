# Syncthing — per-server compose override for offsite (Hetzner storage box).
# Committed to git (not generated) so host paths are auditable in PR diffs.
#
# Generic pattern: stacks/<stack>/compose.yml is reusable across servers;
# this file is per-server. The deploy script auto-merges it via:
#   docker compose -f stacks/<stack>/compose.yml
#                 -f servers/<server>/compose-override/<stack>.yml up -d
#
# Paths here must match data_dir and mounts in configs/syncthing.yml.

services:
  syncthing:
    volumes:
      - /home/spy4x/storage/apps/.volumes/syncthing:/var/syncthing:z
      - /etc/localtime:/etc/localtime:ro,z
      - /home/spy4x/storage/sync:/sync:z
