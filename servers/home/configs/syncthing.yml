# Syncthing — server-specific config for home.
#
# Single source of truth for: data dir, mount roots, folder↔device sharing.
# The compose override (servers/home/compose-override/syncthing.yml) is
# committed separately and merges bind mounts into the generic compose.
# On every deploy, after.deploy.ts reconciles the running Syncthing with
# this file via REST API.
#
# Device resolution: folders reference devices by name (e.g. "spy4x-home").
# Names are resolved to full device IDs via the top-level `devices:` list.
# Adding a new device = add it to `devices:`, then reference by name in any
# folder that should share it.
#
# Deletion policy: removing a folder or device from this file does NOT
# remove it from the running Syncthing instance. after.deploy only
# reconciles add/update — it never deletes. Remove via the Syncthing GUI
# (or the REST API) if you want it gone.
#
# Path expansion: only `~/` is expanded (to `/home/${HOMELAB_USER:-spy4x}/`).
# Absolute paths are passed through unchanged.

# Persistent config + DB location on this host. Mounted as /var/syncthing.
data_dir: ~/ssd-2tb/apps/.volumes/syncthing

# Bind mounts from this host into the container. Container paths become
# the roots used by folder.path below. Hot vs cold is a host concern.
mounts:
  - host: ~/ssd-2tb/sync # fast tier (NVMe)
    container: /sync
  - host: ~/hdd-4tb # cold tier (HDD, Btrfs zstd:3)
    container: /hdd

# Folders shared with other devices. `path` is the container-side absolute
# path. `devices` lists device names (resolved via the `devices:` block).
folders:
  - id: archive
    path: /sync/archive
    type: sendreceive
    devices: [spy4x-offsite, spy4x-phone, spy4x-mini-pc, spy4x-laptop, spy4x-home]

  - id: backups
    path: /hdd/sync/backups
    type: sendreceive
    devices: [spy4x-offsite, spy4x-mini-pc, spy4x-home]

  - id: camera_videos_heavy
    path: /hdd/sync/camera_videos_heavy
    type: sendreceive
    devices: [spy4x-mini-pc, spy4x-home]

  - id: cloud-light-backups
    path: /sync/cloud-light-backups
    type: sendreceive
    devices:
      - spy4x-offsite
      - spy4x-phone
      - spy4x-cloudlab
      - spy4x-mini-pc
      - spy4x-laptop
      - spy4x-home

  - id: code
    path: /sync/code
    type: sendreceive
    devices: [spy4x-mini-pc, spy4x-laptop, spy4x-home]

  - id: essentials
    path: /sync/essentials
    type: sendreceive
    devices: [spy4x-offsite, spy4x-phone, spy4x-mini-pc, spy4x-laptop, spy4x-home]

  - id: random
    path: /sync/random
    type: sendreceive
    devices: [spy4x-offsite, spy4x-phone, spy4x-mini-pc, spy4x-laptop, spy4x-home]

# All devices this server knows about. `id` is the Syncthing-assigned
# device ID; `name` is the alias used in folder.devices above. Add new
# devices here first, then reference them in folders.
devices:
  - id: SXYX5HB-N3HRTIJ-YXRB7X4-JKNFASP-JH64JO3-ZTE5LPC-LNDYWUC-KAF5ZAY
    name: spy4x-offsite
  - id: T7P6EE4-YJL2OFP-5W2KTHK-JONX7AN-TAZ25SC-XPA2SPP-QJ7LW4K-BYMNDQ3
    name: spy4x-phone
  - id: X7UBV7E-24DZZHS-KPW6PIZ-ZCKZRGC-XBT27VB-JCEGJPR-776EGEA-RIM6QQ4
    name: spy4x-cloudlab
  - id: 5U3QROK-XAQ645D-ETOPRBQ-KILG6T6-VPRPUIH-H332S22-VS2JAWG-DLGHQAC
    name: spy4x-mini-pc
  - id: 7F6LMVR-4B734P7-B6LLM6R-TH35BG5-IT5KQST-SIQ6JA2-O6VDRC4-TS6CMAZ
    name: spy4x-laptop
  # Local device — auto-detected by after.deploy via /rest/system/status.
  # Listed here so folders can reference it by name. after.deploy filters
  # it out when calling POST /rest/config/folders (syncthing adds the
  # local device automatically).
  - id: 7RDGAOU-2TZQFUW-J25AFDG-S4EHEWG-GCLJ22R-HODJSXS-76UGK4B-YCYGOQK
    name: spy4x-home
