# Syncthing — server-specific config for home.
#
# Replaces what was previously set via the Syncthing web GUI.
# Stack lives at stacks/syncthing/, but THIS file is the source of truth
# for: where syncthing data lives on this host, which host paths to
# bind into the container, and which folders + devices to share.
#
# On every deploy, stacks/syncthing/before.deploy.ts reads this file and
# generates stacks/syncthing/docker-compose.override.yml. Then
# stacks/syncthing/after.deploy.ts reconciles running syncthing with
# the folders + devices declared here via the REST API.

# Persistent config + DB location on this host. Mounted as /var/syncthing.
data_dir: ~/ssd-2tb/apps/.volumes/syncthing

# Bind mounts from this host into the container. Container paths become
# the roots used by folder.path below. Cold/warm/hot is purely a host-side
# concern — syncthing sees only paths.
mounts:
  - host: ~/ssd-2tb/sync # fast tier (NVMe)
    container: /sync
  - host: ~/hdd-4tb # cold tier (HDD, Btrfs zstd:3)
    container: /hdd

# Folders to share with other devices. The path is the container-side
# absolute path. devices is a list of device IDs (full, see below).
folders:
