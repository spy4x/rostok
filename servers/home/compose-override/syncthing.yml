# Syncthing — server-specific compose override for home.
# Committed to git (not generated) so host paths are auditable in PR diffs.
#
# Generic pattern: stacks/<stack>/compose.yml is reusable across servers;
# this file is per-server. The deploy script auto-merges it via:
#   docker compose -f stacks/<stack>/compose.yml
#                 -f servers/<server>/compose-override/<stack>.yml up -d
#
# On a fresh server, recreate this file with the matching absolute paths.
# Currently: only `~/`-expansion is supported at deploy time (see
# stacks/syncthing/before.deploy.ts); absolute paths are passed through.

services:
  syncthing:
    volumes:
      # Syncthing config + DB. Must be the same path as
      # `data_dir` in configs/syncthing.yml.
      - /home/spy4x/ssd-2tb/apps/.volumes/syncthing:/var/syncthing:z
      - /etc/localtime:/etc/localtime:ro,z
      # Mounts from configs/syncthing.yml (hot + cold tiers). The container
      # paths (`/sync`, `/hdd`) are the roots used by folder.path.
      - /home/spy4x/ssd-2tb/sync:/sync:z
      - /home/spy4x/hdd-4tb:/hdd:z
