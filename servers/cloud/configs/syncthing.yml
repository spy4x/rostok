# Syncthing — server-specific config for cloudlab.
#
# Single source of truth for: data dir, mount roots, folder↔device sharing,
# per-folder / per-device settings (paused, versioning, addresses, ...).
#
# The compose override (servers/cloud/compose-override/syncthing.yml) is
# committed separately and merges bind mounts into the generic compose.
# On every deploy, after.deploy.ts reconciles the running Syncthing with
# this file via the REST API.
#
# Device resolution: folders reference devices by name. Names are resolved
# to full device IDs via the top-level `devices:` list. Each syncthing
# instance stores its own names for remote devices — this file uses the
# names that THIS instance (cloud) shows, which differ from home/offsite.
#
# Deletion policy: removing a folder or device from this file does NOT
# remove it from the running Syncthing instance. after.deploy only
# reconciles add/update — it never deletes.
#
# Path expansion: only `~/` is expanded (to `/home/${HOMELAB_USER:-spy4x}/`).
# Absolute paths are passed through unchanged.

# Persistent config + DB location on this host. Mounted as /var/syncthing.
data_dir: ~/cloudlab/apps/.volumes/syncthing

# Bind mounts from this host into the container. Container paths become
# the roots used by folder.path below.
mounts:
  - host: ~/cloudlab/sync
    container: /sync

# Folders shared with other devices.
folders:
  - id: cloud-light-backups
    path: /sync/cloud-light-backups
    type: sendreceive
    devices: [spy4x-offsite, spy4x-mobile, spy4x-cloud, spy4x-mini-pc, spy4x-laptop, spy4x-server]

# All devices this server knows about.
devices:
  - id: SXYX5HB-N3HRTIJ-YXRB7X4-JKNFASP-JH64JO3-ZTE5LPC-LNDYWUC-KAF5ZAY
    name: spy4x-offsite
  - id: T7P6EE4-YJL2OFP-5W2KTHK-JONX7AN-TAZ25SC-XPA2SPP-QJ7LW4K-BYMNDQ3
    name: spy4x-mobile
  # Local device — auto-detected by after.deploy via /rest/system/status.
  # Listed here so folders can reference it by name.
  - id: X7UBV7E-24DZZHS-KPW6PIZ-ZCKZRGC-XBT27VB-JCEGJPR-776EGEA-RIM6QQ4
    name: spy4x-cloud
  - id: 5U3QROK-XAQ645D-ETOPRBQ-KILG6T6-VPRPUIH-H332S22-VS2JAWG-DLGHQAC
    name: spy4x-mini-pc
  - id: 7F6LMVR-4B734P7-B6LLM6R-TH35BG5-IT5KQST-SIQ6JA2-O6VDRC4-TS6CMAZ
    name: spy4x-laptop
  - id: 7RDGAOU-2TZQFUW-J25AFDG-S4EHEWG-GCLJ22R-HODJSXS-76UGK4B-YCYGOQK
    name: spy4x-server
